<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== SPLASH ===== */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #splash.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        #splash.hidden { display: none !important; }
        #splash-logo {
            width: 120px; height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            animation: splashPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 80px rgba(59,130,246,0.3);
        }
        @keyframes splashPulse {
            0%,100% { transform: scale(1); box-shadow: 0 0 60px rgba(59,130,246,0.2); }
            50% { transform: scale(1.06); box-shadow: 0 0 100px rgba(59,130,246,0.4); }
        }
        #splash-title {
            font-size: 32px; font-weight: 900; color: white; margin-top: 24px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        #splash-sub {
            font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 4px; letter-spacing: 2px;
        }
        #splash-loader {
            margin-top: 30px; width: 200px; height: 3px;
            background: rgba(255,255,255,0.1); border-radius: 4px; overflow: hidden;
        }
        #splash-loader-bar {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #3b82f6, #7b6cf7);
            animation: loadBar 2.5s ease-in-out forwards;
        }
        @keyframes loadBar { 0% { width: 0%; } 50% { width: 70%; } 100% { width: 100%; } }
        #splash-footer {
            position: absolute; bottom: 30px; font-size: 13px;
            color: rgba(255,255,255,0.3); letter-spacing: 0.5px;
        }
        #splash-footer .love { color: #ef4444; }
        #splash-footer .highlight { color: rgba(255,255,255,0.6); }

        /* ===== THEME ===== */
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface-border: #e9edf4;
            --text-primary: #1a2332;
            --text-secondary: #6b7a8f;
            --text-muted: #9aa9bb;
            --orb-idle: #3b82f6;
            --orb-listening: #4f8ef7;
            --orb-thinking: #7b6cf7;
            --orb-speaking: #3b82f6;
            --shadow: 0 4px 20px rgba(0,0,0,0.04);
            --bubble-user: #3b82f6;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #f1f4f9;
            --bubble-assistant-text: #1a2332;
            --scrollbar-track: #f1f4f9;
            --scrollbar-thumb: #d0d8e3;
            --wave-color: rgba(59,130,246,0.3);
        }
        [data-theme="dark"] {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface-border: #2a2a3a;
            --text-primary: #e8edf5;
            --text-secondary: #9aa9bb;
            --text-muted: #6b7a8f;
            --orb-idle: #4f8ef7;
            --orb-listening: #6b9cf7;
            --orb-thinking: #8b7cf7;
            --orb-speaking: #4f8ef7;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
            --bubble-user: #4f8ef7;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #2a2a3a;
            --bubble-assistant-text: #e8edf5;
            --scrollbar-track: #1a1a24;
            --scrollbar-thumb: #3a3a4a;
            --wave-color: rgba(79,142,247,0.3);
        }

        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden;
            padding: 0;
        }

        /* ===== HEADER ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px 6px;
            flex-shrink: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            transition: background 0.3s ease;
            min-height: 52px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #brand svg { width: 28px; height: 28px; }
        #brand h1 {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #header-actions { display: flex; align-items: center; gap: 8px; }
        #theme-toggle {
            background: var(--surface-border);
            border: none;
            border-radius: 50%;
            width: 36px; height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-secondary);
            font-size: 16px;
        }
        #theme-toggle:hover { background: var(--quick-btn-hover); color: var(--text-primary); }
        #status-badge {
            font-size: 11px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 30px;
            background: var(--surface-border);
            color: var(--text-secondary);
            transition: all 0.3s ease;
        }
        #status-badge.active {
            background: var(--orb-idle);
            color: white;
        }

        /* ===== ORB ===== */
        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 0 8px;
            flex-shrink: 0;
            position: relative;
        }
        #orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--orb-idle), #1a2332);
            box-shadow: 0 0 60px rgba(59,130,246,0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            z-index: 2;
        }
        #orb:hover { transform: scale(1.04); }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, var(--orb-listening), #1a2332);
            box-shadow: 0 0 80px rgba(79,142,247,0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, var(--orb-thinking), #1a2332);
            box-shadow: 0 0 80px rgba(123,108,247,0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, var(--orb-speaking), #1a2332);
            box-shadow: 0 0 80px rgba(59,130,246,0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbSpeak { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(1.04) translateY(-3px); } }

        /* Waveform */
        .waveform {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 130px; height: 130px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .waveform.active { opacity: 1; }
        .waveform .bar {
            position: absolute;
            bottom: 50%; left: 50%;
            width: 3px;
            height: 10px;
            background: var(--wave-color);
            border-radius: 4px;
            transform-origin: bottom center;
            animation: waveAnim 0.8s ease-in-out infinite alternate;
        }
        .waveform .bar:nth-child(1) { transform: translate(-50%,0) rotate(0deg); animation-delay: 0s; height: 14px; }
        .waveform .bar:nth-child(2) { transform: translate(-50%,0) rotate(18deg); animation-delay: 0.1s; height: 20px; }
        .waveform .bar:nth-child(3) { transform: translate(-50%,0) rotate(36deg); animation-delay: 0.2s; height: 26px; }
        .waveform .bar:nth-child(4) { transform: translate(-50%,0) rotate(54deg); animation-delay: 0.3s; height: 30px; }
        .waveform .bar:nth-child(5) { transform: translate(-50%,0) rotate(72deg); animation-delay: 0.4s; height: 32px; }
        .waveform .bar:nth-child(6) { transform: translate(-50%,0) rotate(90deg); animation-delay: 0.5s; height: 34px; }
        .waveform .bar:nth-child(7) { transform: translate(-50%,0) rotate(108deg); animation-delay: 0.4s; height: 32px; }
        .waveform .bar:nth-child(8) { transform: translate(-50%,0) rotate(126deg); animation-delay: 0.3s; height: 30px; }
        .waveform .bar:nth-child(9) { transform: translate(-50%,0) rotate(144deg); animation-delay: 0.2s; height: 26px; }
        .waveform .bar:nth-child(10) { transform: translate(-50%,0) rotate(162deg); animation-delay: 0.1s; height: 20px; }
        .waveform .bar:nth-child(11) { transform: translate(-50%,0) rotate(180deg); animation-delay: 0s; height: 14px; }
        .waveform .bar:nth-child(12) { transform: translate(-50%,0) rotate(198deg); animation-delay: 0.1s; height: 20px; }
        .waveform .bar:nth-child(13) { transform: translate(-50%,0) rotate(216deg); animation-delay: 0.2s; height: 26px; }
        .waveform .bar:nth-child(14) { transform: translate(-50%,0) rotate(234deg); animation-delay: 0.3s; height: 30px; }
        .waveform .bar:nth-child(15) { transform: translate(-50%,0) rotate(252deg); animation-delay: 0.4s; height: 32px; }
        .waveform .bar:nth-child(16) { transform: translate(-50%,0) rotate(270deg); animation-delay: 0.5s; height: 34px; }
        .waveform .bar:nth-child(17) { transform: translate(-50%,0) rotate(288deg); animation-delay: 0.4s; height: 32px; }
        .waveform .bar:nth-child(18) { transform: translate(-50%,0) rotate(306deg); animation-delay: 0.3s; height: 30px; }
        .waveform .bar:nth-child(19) { transform: translate(-50%,0) rotate(324deg); animation-delay: 0.2s; height: 26px; }
        .waveform .bar:nth-child(20) { transform: translate(-50%,0) rotate(342deg); animation-delay: 0.1s; height: 20px; }
        @keyframes waveAnim {
            0% { transform: translate(-50%,0) rotate(var(--rot)) scaleY(0.2); }
            100% { transform: translate(-50%,0) rotate(var(--rot)) scaleY(1); }
        }

        #orb-status {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        #orb-sub {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-weight: 400;
        }

        /* ===== CHAT ===== */
        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--surface-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 16px 10px;
            transition: background 0.3s ease;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 12px 18px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .message {
            margin: 4px 0;
            padding: 8px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            line-height: 1.5;
            font-size: 13px;
            font-weight: 400;
        }
        .user-msg {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: var(--bubble-assistant);
            color: var(--bubble-assistant-text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender { color: var(--text-secondary); }
        .user-msg .sender { color: rgba(255,255,255,0.7); }
        .message .content { display: block; }

        .tool-msg {
            background: var(--surface-border);
            color: var(--text-secondary);
            margin: 4px auto;
            padding: 4px 14px;
            border-radius: 30px;
            font-size: 11px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #orb { width: 72px; height: 72px; }
            #brand h1 { font-size: 16px; }
            #brand svg { width: 22px; height: 22px; }
            #orb-status { font-size: 12px; }
            .message { font-size: 12px; padding: 6px 12px; max-width: 88%; }
            #chat-container { padding: 10px 12px; }
            #header { padding: 6px 14px 4px; min-height: 44px; }
            #chat-wrapper { margin: 0 8px 6px; border-radius: 12px; }
            .waveform { width: 100px; height: 100px; }
            #splash-logo { width: 80px; height: 80px; font-size: 32px; }
            #splash-title { font-size: 24px; }
            #splash-loader { width: 150px; }
        }
        @media (min-width: 768px) and (max-width: 1024px) {
            #orb { width: 80px; height: 80px; }
            .waveform { width: 110px; height: 110px; }
        }
        @media (min-width: 1025px) {
            #orb { width: 100px; height: 100px; }
            .waveform { width: 140px; height: 140px; }
            #chat-wrapper { max-width: 700px; }
        }

        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }
    </style>
</head>

        var WEBSITE_MAP = {
            youtube: 'https://youtube.com', instagram: 'https://instagram.com',
            facebook: 'https://facebook.com', twitter: 'https://twitter.com',
            whatsapp: 'https://web.whatsapp.com', telegram: 'https://web.telegram.org',
            snapchat: 'https://snapchat.com', linkedin: 'https://linkedin.com',
            reddit: 'https://reddit.com', discord: 'https://discord.com',
            google: 'https://google.com', gmail: 'https://gmail.com',
            maps: 'https://maps.google.com', drive: 'https://drive.google.com',
            docs: 'https://docs.google.com', translate: 'https://translate.google.com',
            meet: 'https://meet.google.com', netflix: 'https://netflix.com',
            amazonprime: 'https://primevideo.com', hotstar: 'https://hotstar.com',
            sonyliv: 'https://sonyliv.com', spotify: 'https://spotify.com',
            amazon: 'https://amazon.in', flipkart: 'https://flipkart.com',
            myntra: 'https://myntra.com', zomato: 'https://zomato.com',
            swiggy: 'https://swiggy.com', github: 'https://github.com',
            zoom: 'https://zoom.us', teams: 'https://teams.microsoft.com',
            wikipedia: 'https://wikipedia.org', chatgpt: 'https://chatgpt.com',
            paytm: 'https://paytm.com', pubg: 'https://pubg.com',
            freefire: 'https://freefire.com', bgmi: 'https://bgmi.com'
        };

        var OPEN_WORDS = [
            'open', 'kholo', 'khol', 'chalao', 'start', 'launch',
            'go to', 'show', 'show me', 'खोलो', 'खोल', 'चलाओ',
            'open karo', 'khol do', 'khol de', 'शुरू करो',
            'खोल दो', 'खोल दे', 'चला दो', 'शुरू कर दो'
        ];

        // ============================================================
        // DOM REFS
        // ============================================================
        var orb = document.getElementById('orb');
        var orbStatus = document.getElementById('orb-status');
        var orbSub = document.getElementById('orb-sub');
        var chatContainer = document.getElementById('chat-container');
        var themeToggle = document.getElementById('theme-toggle');
        var statusBadge = document.getElementById('status-badge');
        var waveform = document.getElementById('waveform');

        // ============================================================
        // THEME
        // ============================================================
        var isDark = false;
        themeToggle.addEventListener('click', function() {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;
            var map = {
                idle: ['Zishu is ready', 'Tap orb or say "Hey Zishu"', '● Idle'],
                listening: ['Listening...', 'Speak now', '● Listening'],
                thinking: ['Thinking...', 'Processing...', '◉ Thinking'],
                speaking: ['Speaking...', 'Zishu is responding', '● Speaking']
            };
            var data = map[newState] || map.idle;
            orbStatus.textContent = data[0];
            orbSub.textContent = data[1];
            statusBadge.textContent = data[2];
            statusBadge.className = newState === STATE.IDLE ? '' : 'active';
            waveform.className = 'waveform' + (newState !== STATE.IDLE ? ' active' : '');
        }

        orb.addEventListener('click', function() {
            if (isProcessing) return;
            if (state === STATE.IDLE || state === STATE.SPEAKING) {
                wakeWordDetected = true;
                startListening();
            } else if (state === STATE.LISTENING) {
                stopListening();
                setOrbState(STATE.IDLE);
            }
        });

        // ============================================================
        // SPEECH RECOGNITION - FIXED
        // ============================================================
        function initSpeechRecognition() {
            var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) { orbStatus.textContent = 'Browser not supported'; return null; }
            var rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onstart = function() {
                clearRestartTimer();
                setOrbState(STATE.LISTENING);
            };

            rec.onresult = function(event) {
                var finalText = '';
                var interimText = '';
                for (var i = event.resultIndex; i < event.results.length; i++) {
                    var t = event.results[i][0].transcript.toLowerCase().trim();
                    if (event.results[i].isFinal) finalText = t;
                    else interimText = t;
                }

                var text = finalText || interimText;
                if (!text) return;

                // Check for wake word
                var hasWake = WAKE_WORDS.some(function(w) { return text.indexOf(w) !== -1; });
                if (hasWake && !wakeWordDetected && !isProcessing) {
                    wakeWordDetected = true;
                    var query = text.replace(new RegExp(WAKE_WORDS.join('|'), 'gi'), '').trim();
                    if (query.length > 0) {
                        // Stop listening and process
                        try { rec.stop(); } catch (e) {}
                        handleUserQuery(query);
                    } else {
                        orbSub.textContent = 'Listening for command...';
                        setTimeout(function() {
                            wakeWordDetected = false;
                            if (state === STATE.IDLE) startListening();
                        }, 3000);
                    }
                } else if (wakeWordDetected && !isProcessing && finalText) {
                    var query = text.replace(new RegExp(WAKE_WORDS.join('|'), 'gi'), '').trim();
                    if (query.length > 0) {
                        try { rec.stop(); } catch (e) {}
                        handleUserQuery(query);
                    }
                }
            };

            rec.onerror = function(event) {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    // Silent
                } else {
                    scheduleRestart(1000);
                }
            };

            rec.onend = function() {
                if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                    if (!isRestartScheduled) scheduleRestart(500);
                }
            };

            return rec;
        }

        function startListening() {
            clearRestartTimer();
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                try { recognition.stop(); } catch (ex) {}
                setTimeout(function() {
                    try { recognition.start(); } catch (ex) {}
                }, 200);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) setOrbState(STATE.IDLE);
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(function() {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) { clearTimeout(restartTimer); restartTimer = null; }
        }

        // ============================================================
        // INTENT SYSTEM
        // ============================================================
        function detectIntent(query) {
            var q = query.toLowerCase().trim();

            // Interrupt
            if (['stop', 'ruk jao', 'bass', 'रुको', 'हट'].some(function(w) { return q.indexOf(w) !== -1; })) {
                return { type: 'interrupt' };
            }

            // Open app/website
            for (var site in SITE_ALIASES) {
                var aliases = SITE_ALIASES[site];
                var found = aliases.some(function(a) { return q.indexOf(a) !== -1; });
                if (found) {
                    var wantsOpen = OPEN_WORDS.some(function(w) { return q.indexOf(w) !== -1; }) || 
                                   aliases.some(function(a) { return q === a; }) || q === site;
                    if (wantsOpen) return { type: 'open_app', value: site };
                }
            }

            // Weather
            if (q.indexOf('weather') !== -1 || q.indexOf('mausam') !== -1 || q.indexOf('मौसम') !== -1) {
                var m = q.match(/(?:weather|mausam|मौसम)\s+(?:in|of|for|का|की|में)?\s*([a-zA-Z\u0900-\u097F\s]+)/);
                return { type: 'weather', value: m ? m[1].trim() : 'Delhi' };
            }

            // Time
            if (q.indexOf('time') !== -1 || q.indexOf('samay') !== -1 || q.indexOf('समय') !== -1 || q.indexOf('baje') !== -1) {
                return { type: 'time' };
            }

            // Calculate
            if (q.indexOf('calculate') !== -1 || q.indexOf('solve') !== -1 || q.indexOf('हल') !== -1) {
                var e = q.replace(/calculate|solve|हल|करो|karo/g, '').trim();
                if (e) return { type: 'calculate', value: e };
            }

            // Reminder
            if (q.indexOf('reminder') !== -1 || q.indexOf('remind') !== -1 || q.indexOf('याद') !== -1) {
                var m = q.match(/(?:reminder|remind|याद)\s+(?:me|mujhe|मुझे)?\s*(.+)/i);
                return { type: 'reminder', value: m ? m[1].trim() : q };
            }

            // Note
            if (q.indexOf('note') !== -1 || q.indexOf('save') !== -1 || q.indexOf('लिखो') !== -1 || q.indexOf('नोट') !== -1) {
                var m = q.match(/(?:note|save|लिखो|नोट)\s+(.+)/i);
                return { type: 'note', value: m ? m[1].trim() : q };
            }

            // Search
            if (q.indexOf('search') !== -1 || q.indexOf('खोजो') !== -1 || q.indexOf('ढूंढो') !== -1) {
                var m = q.replace(/search|खोजो|ढूंढो|karo|do/g, '').trim();
                return { type: 'search', value: m || q };
            }

            return { type: 'chat', value: query };
        }

        // ============================================================
        // EXECUTE INTENT
        // ============================================================
        async function executeIntent(intent) {
            if (intent.type === 'interrupt') {
                if (currentUtterance) {
                    window.speechSynthesis.cancel();
                    currentUtterance = null;
                    setOrbState(STATE.IDLE);
                    addMessage('Zishu', 'Haan, batao?', 'assistant-msg');
                    scheduleRestart(500);
                }
                return true;
            }

            if (intent.type === 'open_app') {
                var url = WEBSITE_MAP[intent.value];
                if (url) {
                    addToolMessage('Opening ' + intent.value + '...');
                    try {
                        window.location.assign(url);
                    } catch (e) {
                        try { window.location.href = url; } catch (e2) {
                            var a = document.createElement('a');
                            a.href = url; a.target = '_blank';
                            document.body.appendChild(a); a.click(); a.remove();
                        }
                    }
                    return true;
                }
                addToolMessage('App not found: ' + intent.value);
                return true;
            }

            if (intent.type === 'weather') {
                var weather = await getWeather(intent.value || 'Delhi');
                var reply = 'Weather in ' + (intent.value || 'Delhi') + ': ' + weather;
                addMessage('Zishu', reply, 'assistant-msg');
                speakText(reply);
                return true;
            }

            if (intent.type === 'time') {
                var now = new Date();
                var time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                var date = now.toLocaleDateString('en-US', { weekday: 'long', day: 'numeric', month: 'long' });
                var reply = 'Aaj ' + date + ' hai, abhi ' + time + ' baj rahe hain.';
                addMessage('Zishu', reply, 'assistant-msg');
                speakText(reply);
                return true;
            }

            if (intent.type === 'calculate') {
                try {
                    var result = Function('"use strict"; return (' + intent.value + ')')();
                    var reply = 'Result: ' + result;
                    addMessage('Zishu', reply, 'assistant-msg');
                    speakText(reply);
                } catch (e) {
                    addMessage('Zishu', 'Could not calculate that.', 'assistant-msg');
                }
                return true;
            }

            if (intent.type === 'reminder') {
                var reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                reminders.push({ text: intent.value, time: new Date().toISOString() });
                localStorage.setItem('zishu_reminders', JSON.stringify(reminders));
                var reply = 'Reminder set: ' + intent.value;
                addMessage('Zishu', reply, 'assistant-msg');
                speakText(reply);
                return true;
            }

            if (intent.type === 'note') {
                var notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                notes.push({ text: intent.value, date: new Date().toISOString() });
                localStorage.setItem('zishu_notes', JSON.stringify(notes));
                var reply = 'Note saved: ' + intent.value;
                addMessage('Zishu', reply, 'assistant-msg');
                speakText(reply);
                return true;
            }

            if (intent.type === 'search') {
                addToolMessage('Searching...');
                window.location.href = 'https://google.com/search?q=' + encodeURIComponent(intent.value);
                return true;
            }

            return false;
        }

        async function getWeather(city) {
            try {
                var r = await fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=%C+%t');
                return (await r.text()).trim() || 'Weather unavailable';
            } catch (e) { return 'Could not fetch weather.'; }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function addMessage(sender, text, className) {
            var div = document.createElement('div');
            div.className = 'message ' + className;
            var s = document.createElement('span');
            s.className = 'sender';
            s.textContent = sender;
            var c = document.createElement('span');
            c.className = 'content';
            c.textContent = text;
            div.appendChild(s); div.appendChild(c);
            chatContainer.appendChild(div);
            setTimeout(function() { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        function addToolMessage(text) {
            var div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            setTimeout(function() { chatContainer.scrollTop = chatContainer.scrollHeight; }, 50);
        }

        // ============================================================
        // STREAM + TTS
        // ============================================================
        async function streamResponse(text) {
            setOrbState(STATE.SPEAKING);
            var div = document.createElement('div');
            div.className = 'message assistant-msg';
            var s = document.createElement('span');
            s.className = 'sender';
            s.textContent = 'Zishu';
            var c = document.createElement('span');
            c.className = 'content';
            div.appendChild(s); div.appendChild(c);
            chatContainer.appendChild(div);

            var acc = '';
            for (var i = 0; i < text.length; i++) {
                acc += text[i];
                c.textContent = acc;
                if (i % 3 === 0 || i === text.length - 1) chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(function(r) { setTimeout(r, 8 + Math.random() * 4); });
            }
            speakText(text);
        }

        function speakText(text) {
            try {
                if (currentUtterance) window.speechSynthesis.cancel();
                var u = new SpeechSynthesisUtterance(text);
                u.lang = 'hi-IN'; u.rate = 0.9; u.pitch = 1.05; u.volume = 1;
                var voices = window.speechSynthesis.getVoices();
                var female = voices.filter(function(v) { 
                    return v.lang.startsWith('hi') && (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('swara'));
                });
                if (female.length > 0) u.voice = female[0];
                else { var hv = voices.find(function(v) { return v.lang.startsWith('hi'); }); if (hv) u.voice = hv; }
                u.onstart = function() { setOrbState(STATE.SPEAKING); };
                u.onend = function() {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); wakeWordDetected = false; scheduleRestart(800); }
                };
                u.onerror = function() {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); wakeWordDetected = false; scheduleRestart(800); }
                };
                currentUtterance = u;
                window.speechSynthesis.speak(u);
            } catch (e) {
                console.error('TTS error:', e);
                if (!isProcessing) { setOrbState(STATE.IDLE); wakeWordDetected = false; scheduleRestart(800); }
            }
        }

        // ============================================================
        // MAIN HANDLER - WITH RATE LIMIT HANDLING
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            addMessage('You', query, 'user-msg');

            var intent = detectIntent(query);
            console.log('🎯 Intent:', intent);

            var executed = await executeIntent(intent);
            if (!executed && intent.type === 'chat') {
                conversationHistory.push({ role: 'user', content: query });
                try {
                    var response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_API_KEY },
                        body: JSON.stringify({
                            model: GROQ_MODEL,
                            messages: [{ role: 'system', content: SYSTEM_PROMPT }].concat(conversationHistory),
                            temperature: 0.7, max_tokens: 500
                        })
                    });

                    // Handle rate limit / server errors
                    if (response.status === 429) {
                        var busyReply = 'Abhi server busy hai, thodi der baad try karein.';
                        addMessage('Zishu', busyReply, 'assistant-msg');
                        speakText(busyReply);
                        isProcessing = false;
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                        return;
                    }

                    if (!response.ok) {
                        var errorReply = 'Kuch technical issue aa raha hai. Thodi der baad try karein.';
                        addMessage('Zishu', errorReply, 'assistant-msg');
                        speakText(errorReply);
                        isProcessing = false;
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                        return;
                    }

                    var data = await response.json();
                    var reply = data.choices[0].message.content;

                    // Handle tools in reply
                    if (reply.indexOf('TOOL:') !== -1) {
                        var m = reply.match(/TOOL:\s*(\w+)\((.*)\)/);
                        if (m) {
                            var args = m[2] ? m[2].split(',').map(function(s) { return s.trim().replace(/^['"]|['"]$/g, ''); }) : [];
                            if (m[1] === 'set_reminder') {
                                var reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                                reminders.push({ text: args[0] || 'reminder', time: args[1] || 'now' });
                                localStorage.setItem('zishu_reminders', JSON.stringify(reminders));
                                reply = 'Reminder set: ' + (args[0] || 'reminder');
                            } else if (m[1] === 'create_note') {
                                var notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                                notes.push({ text: args[0] || 'note', date: new Date().toISOString() });
                                localStorage.setItem('zishu_notes', JSON.stringify(notes));
                                reply = 'Note saved: ' + (args[0] || 'note');
                            }
                        }
                    }

                    conversationHistory.push({ role: 'assistant', content: reply });

                    // Memory - only if user shares name
                    var memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
                    var nameMatch = reply.match(/(?:your name is|aapka naam|tumhara naam|mera naam)\s+([a-zA-Z\u0900-\u097F\s]+)/i);
                    if (nameMatch && !memory.name) {
                        memory.name = nameMatch[1].trim();
                        localStorage.setItem('zishu_memory', JSON.stringify(memory));
                    }

                    await streamResponse(reply);

                } catch (error) {
                    console.error('Error:', error);
                    var errorReply = 'Abhi server busy hai, thodi der baad try karein.';
                    addToolMessage('Error: ' + error.message);
                    addMessage('Zishu', errorReply, 'assistant-msg');
                    speakText(errorReply);
                    setOrbState(STATE.IDLE);
                }
            }

            isProcessing = false;
            if (state !== STATE.LISTENING) {
                setOrbState(STATE.IDLE);
                wakeWordDetected = false;
                scheduleRestart(1000);
            }
        }

        // ============================================================
        // KEYBOARD
        // ============================================================
        document.addEventListener('keydown', function(e) {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                if (state === STATE.IDLE || state === STATE.SPEAKING) {
                    wakeWordDetected = true;
                    startListening();
                } else if (state === STATE.LISTENING) {
                    stopListening();
                    setOrbState(STATE.IDLE);
                }
            }
        });

        // ============================================================
        // INIT
        // ============================================================
        setOrbState(STATE.IDLE);
        // Welcome message - NO CREATOR INFO
        addMessage('Zishu', 'Namaste! Main Zishu hoon. "Hey Zishu" boliye ya orb dabayein aur baat karein.', 'assistant-msg');

        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = function() { window.speechSynthesis.getVoices(); };
        }

        console.log('🚀 Zishu AI v4.3 - Fully Working');
        console.log('🎯 Say "Hey Zishu" or tap orb');
        console.log('🔄 Rate limit handling enabled');
    </script>
