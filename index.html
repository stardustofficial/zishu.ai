<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 24px 16px;
            color: #1a2332;
            overflow: hidden;
        }

        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-shrink: 0;
            padding: 0 4px;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        #brand svg {
            width: 32px;
            height: 32px;
        }
        #brand h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand .sub {
            font-size: 12px;
            font-weight: 400;
            color: #6b7a8f;
            -webkit-text-fill-color: #6b7a8f;
            background: none;
            margin-left: 4px;
        }
        #status-badge {
            font-size: 13px;
            font-weight: 500;
            padding: 6px 16px;
            border-radius: 30px;
            background: #e9edf4;
            color: #6b7a8f;
            transition: all 0.3s ease;
        }
        #status-badge.active {
            background: #3b82f6;
            color: white;
        }

        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 16px 0 20px;
            flex-shrink: 0;
        }
        #orb {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        #orb:hover {
            transform: scale(1.04);
        }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, #4f8ef7, #1a2332);
            box-shadow: 0 0 80px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, #7b6cf7, #1a2332);
            box-shadow: 0 0 80px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, #3b82f6, #1a2332);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbSpeak {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.04) translateY(-3px); }
        }

        #orb-status {
            margin-top: 14px;
            font-size: 16px;
            font-weight: 600;
            color: #1a2332;
            letter-spacing: -0.2px;
        }
        #orb-sub {
            font-size: 13px;
            color: #6b7a8f;
            margin-top: 4px;
            font-weight: 400;
        }

        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.04);
            border: 1px solid #e9edf4;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar {
            width: 4px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f4f9;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #d0d8e3;
            border-radius: 10px;
        }

        .message {
            margin: 8px 0;
            padding: 12px 18px;
            border-radius: 16px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.7;
            font-size: 15px;
            font-weight: 400;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .user-msg {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: #f1f4f9;
            color: #1a2332;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 12px;
            opacity: 0.7;
            display: block;
            margin-bottom: 3px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender {
            color: #6b7a8f;
        }
        .user-msg .sender {
            color: rgba(255, 255, 255, 0.8);
        }
        .message .content {
            display: block;
        }

        .tool-msg {
            background: #e9edf4;
            color: #6b7a8f;
            margin: 6px auto;
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 13px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
        }

        #footer {
            display: flex;
            justify-content: space-between;
            padding: 10px 4px 0;
            flex-shrink: 0;
            font-size: 12px;
            color: #9aa9bb;
            letter-spacing: 0.2px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 14px 10px;
            }
            #orb {
                width: 80px;
                height: 80px;
            }
            #brand h1 {
                font-size: 18px;
            }
            #brand .sub {
                font-size: 10px;
            }
            #orb-status {
                font-size: 14px;
            }
            .message {
                font-size: 14px;
                padding: 10px 14px;
                max-width: 88%;
            }
            #chat-container {
                padding: 14px 16px;
            }
            #status-badge {
                font-size: 11px;
                padding: 4px 12px;
            }
        }
    </style>
</head>
<body>

    <div id="header">
        <div id="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.8">
                <defs>
                    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="#3b82f6" />
                        <stop offset="100%" stop-color="#7b6cf7" />
                    </linearGradient>
                </defs>
                <circle cx="12" cy="12" r="10" />
                <path d="M8 12l2 2 4-4" />
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
            </svg>
            <div style="display:flex;align-items:baseline;gap:6px;">
                <h1>ZISHU</h1>
                <span class="sub">voice intelligence</span>
            </div>
        </div>
        <div id="status-badge">● Idle</div>
    </div>

    <div id="orb-container">
        <div id="orb"></div>
        <div id="orb-status">Zishu is ready</div>
        <div id="orb-sub">Tap orb or press Space to talk</div>
    </div>

    <div id="chat-wrapper">
        <div id="chat-container"></div>
    </div>

    <div id="footer">
        <span>private · local</span>
        <span>v2.6</span>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const GROQ_API_KEY = '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';
        const GROQ_MODEL = 'llama-3.1-8b-instant';

        // ============================================================
        // STATE MACHINE
        // ============================================================
        const STATE = {
            IDLE: 'idle',
            LISTENING: 'listening',
            THINKING: 'thinking',
            SPEAKING: 'speaking'
        };

        let state = STATE.IDLE;
        let recognition = null;
        let isProcessing = false;
        let currentUtterance = null;
        let restartTimer = null;

        // ============================================================
        // SYSTEM PROMPT
        // ============================================================
        const SYSTEM_PROMPT = `You are Zishu, a female voice assistant with a warm, helpful personality.

        IMPORTANT GENDER RULES:
        - Always refer to yourself as "main" (feminine) in Hindi
        - Use feminine verb endings: "kar sakti hoon", "bol sakti hoon", "de sakti hoon"

        RESPONSE STYLE:
        - Give detailed, complete answers
        - Be warm and helpful like a trusted friend
        - Use Hinglish naturally - mix Hindi and English

        TOOLS (use EXACT format):
        - TOOL: set_reminder(text, time) - sets a reminder
        - TOOL: create_note(text) - saves a note
        - TOOL: get_weather(city) - gets weather
        - TOOL: get_time(city) - gets current time
        - TOOL: calculate(expression) - does math
        - TOOL: translate(text, language) - translates text

        Note: For opening websites, the system handles it locally. Just respond with confirmation.`;

        let conversationHistory = [
            { role: 'system', content: SYSTEM_PROMPT }
        ];

        let memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');

        // ============================================================
        // DOM REFS
        // ============================================================
        const orb = document.getElementById('orb');
        const orbStatus = document.getElementById('orb-status');
        const orbSub = document.getElementById('orb-sub');
        const chatContainer = document.getElementById('chat-container');
        const statusBadge = document.getElementById('status-badge');

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;

            const statusMap = {
                idle: ['Zishu is ready', 'Tap orb or press Space to talk', '● Idle'],
                listening: ['Listening...', 'Speak now', '● Listening'],
                thinking: ['Thinking...', 'Processing your request', '◉ Thinking'],
                speaking: ['Speaking...', 'Zishu is responding', '● Speaking']
            };
            const [status, sub, badge] = statusMap[newState] || statusMap.idle;
            orbStatus.textContent = status;
            orbSub.textContent = sub;
            statusBadge.textContent = badge;
            statusBadge.className = newState === STATE.IDLE ? '' : 'active';
        }

        orb.addEventListener('click', toggleListening);

        // ============================================================
        // TOGGLE LISTENING
        // ============================================================
        function toggleListening() {
            if (isProcessing) {
                orbSub.textContent = 'Please wait...';
                return;
            }

            if (state === STATE.IDLE || state === STATE.SPEAKING) {
                startListening();
            } else if (state === STATE.LISTENING) {
                stopListening();
            }
        }

        // ============================================================
        // SPEECH RECOGNITION - STABLE VERSION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                orbStatus.textContent = 'Browser not supported';
                return null;
            }
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                setOrbState(STATE.LISTENING);
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                if (transcript.length > 0) {
                    // Stop listening immediately when user speaks
                    stopListening();
                    handleUserQuery(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    orbSub.textContent = 'No speech detected. Try again.';
                    // Controlled restart
                    scheduleRestart(800);
                } else {
                    orbSub.textContent = 'Error: ' + event.error;
                    scheduleRestart(1000);
                }
            };

            rec.onend = () => {
                // Only restart if we're still supposed to be listening
                if (state === STATE.LISTENING && !isProcessing) {
                    scheduleRestart(300);
                } else if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                }
            };

            return rec;
        }

        function startListening() {
            clearTimeout(restartTimer);
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                // If already started, stop and restart
                try {
                    recognition.stop();
                    setTimeout(() => {
                        recognition.start();
                        setOrbState(STATE.LISTENING);
                    }, 200);
                } catch (ex) {
                    console.error('Failed to start:', ex);
                    setOrbState(STATE.IDLE);
                }
            }
        }

        function stopListening() {
            clearTimeout(restartTimer);
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) {
                setOrbState(STATE.IDLE);
            }
        }

        function scheduleRestart(delay) {
            clearTimeout(restartTimer);
            restartTimer = setTimeout(() => {
                if (state === STATE.LISTENING || state === STATE.IDLE) {
                    startListening();
                }
            }, delay);
        }

        // ============================================================
        // WEBSITE MAPPING
        // ============================================================
        const WEBSITE_MAP = {
            'youtube': 'https://youtube.com',
            'google': 'https://google.com',
            'gmail': 'https://gmail.com',
            'github': 'https://github.com',
            'reddit': 'https://reddit.com',
            'twitter': 'https://twitter.com',
            'x': 'https://twitter.com',
            'instagram': 'https://instagram.com',
            'whatsapp': 'https://web.whatsapp.com',
            'maps': 'https://maps.google.com',
            'drive': 'https://drive.google.com',
            'docs': 'https://docs.google.com',
            'translate': 'https://translate.google.com',
            'facebook': 'https://facebook.com',
            'linkedin': 'https://linkedin.com',
            'spotify': 'https://spotify.com',
            'netflix': 'https://netflix.com',
            'amazon': 'https://amazon.in',
            'flipkart': 'https://flipkart.com',
            'zomato': 'https://zomato.com',
            'swiggy': 'https://swiggy.com'
        };

        // ============================================================
        // LOCAL COMMAND DETECTION - ROBUST VERSION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();
            const sites = Object.keys(WEBSITE_MAP);
            const openWords = [
                'open', 'kholo', 'khol', 'chalao', 'start', 'launch',
                'open karo', 'khol do', 'kholo na', 'khol de', 'kholo ji'
            ];

            for (const site of sites) {
                if (!q.includes(site)) continue;
                
                // Check if user wants to open this site
                const wantsOpen = openWords.some(word => q.includes(word)) || q === site;
                if (wantsOpen) {
                    return {
                        type: 'open_website',
                        value: site
                    };
                }
            }

            return null;
        }

        // ============================================================
        // DIRECT WEBSITE NAVIGATION - IMMEDIATE
        // ============================================================
        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }

            addToolMessage('Opening ' + siteName + '...');
            
            // CRITICAL: Navigate immediately, no setTimeout
            window.location.href = url;
            return true;
        }

        // ============================================================
        // TOOL SYSTEM
        // ============================================================
        async function executeTool(toolString) {
            try {
                const match = toolString.match(/TOOL:\s*(\w+)\((.*)\)/);
                if (!match) return null;
                const [, toolName, params] = match;
                const args = params ? params.split(',').map(s => s.trim().replace(/^['"]|['"]$/g, '')) : [];

                switch (toolName) {
                    case 'set_reminder': {
                        const reminder = { text: args[0] || 'reminder', time: args[1] || 'now' };
                        const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                        reminders.push(reminder);
                        localStorage.setItem('zishu_reminders', JSON.stringify(reminders));
                        return 'Reminder set: ' + reminder.text + ' at ' + reminder.time;
                    }

                    case 'create_note': {
                        const note = args[0] || 'empty note';
                        const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                        notes.push({ text: note, date: new Date().toISOString() });
                        localStorage.setItem('zishu_notes', JSON.stringify(notes));
                        return 'Note saved: ' + note;
                    }

                    case 'get_weather': {
                        const city = args[0] || 'Delhi';
                        const weatherData = await fetchWeather(city);
                        return 'Weather in ' + city + ': ' + weatherData;
                    }

                    case 'get_time': {
                        const tz = args[0] || 'Asia/Kolkata';
                        const time = new Date().toLocaleString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
                        return 'Current time in ' + tz.split('/').pop() + ': ' + time;
                    }

                    case 'calculate': {
                        const expr = args[0] || '0';
                        const result = Function('"use strict"; return (' + expr + ')')();
                        return 'Result: ' + result;
                    }

                    case 'translate': {
                        const text = args[0] || '';
                        const lang = args[1] || 'English';
                        return 'Translated to ' + lang + ': ' + text + ' (demo)';
                    }

                    default:
                        return 'Tool ' + toolName + ' not recognized';
                }
            } catch (error) {
                return 'Tool error: ' + error.message;
            }
        }

        async function fetchWeather(city) {
            try {
                const response = await fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=%C+%t');
                const data = await response.text();
                return data.trim() || 'Weather data unavailable';
            } catch {
                return 'Could not fetch weather. Please try again.';
            }
        }

        function addToolMessage(text) {
            const div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // STREAMING RESPONSE
        // ============================================================
        async function streamResponse(text) {
            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            let accumulatedText = '';
            for (let i = 0; i < text.length; i++) {
                accumulatedText += text[i];
                contentSpan.textContent = accumulatedText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 10 + Math.random() * 8));
            }

            speakText(text);
            return msgDiv;
        }

        // ============================================================
        // TTS
        // ============================================================
        function speakText(text) {
            try {
                if (currentUtterance) {
                    window.speechSynthesis.cancel();
                }

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                utterance.volume = 1;

                const voices = window.speechSynthesis.getVoices();
                const femaleVoices = voices.filter(v => 
                    v.lang.startsWith('hi') && 
                    (v.name.toLowerCase().includes('female') || 
                     v.name.toLowerCase().includes('swara') ||
                     v.name.toLowerCase().includes('lekh'))
                );
                if (femaleVoices.length > 0) {
                    utterance.voice = femaleVoices[0];
                } else {
                    const hindiVoice = voices.find(v => v.lang.startsWith('hi'));
                    if (hindiVoice) utterance.voice = hindiVoice;
                }

                utterance.onstart = () => {
                    setOrbState(STATE.SPEAKING);
                };

                utterance.onend = () => {
                    currentUtterance = null;
                    if (!isProcessing) {
                        setOrbState(STATE.IDLE);
                        // Auto-restart listening after speaking
                        scheduleRestart(1200);
                    }
                };

                utterance.onerror = () => {
                    currentUtterance = null;
                    if (!isProcessing) {
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);

            } catch (error) {
                console.error('TTS error:', error);
                if (!isProcessing) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
            }
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            clearTimeout(restartTimer);
            setOrbState(STATE.THINKING);

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'You';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = query;
            userDiv.appendChild(senderSpan);
            userDiv.appendChild(contentSpan);
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // ============================================================
            // STEP 1: LOCAL COMMAND DETECTION - IMMEDIATE EXECUTION
            // ============================================================
            const localCommand = detectLocalCommand(query);
            if (localCommand && localCommand.type === 'open_website') {
                // Navigate IMMEDIATELY - no LLM wait
                const success = openWebsiteDirectly(localCommand.value);
                if (success) {
                    const reply = 'Main ' + localCommand.value + ' khol rahi hoon.';
                    conversationHistory.push({ role: 'assistant', content: reply });
                    
                    // Stream confirmation (website already opened)
                    await streamResponse(reply);
                    
                    isProcessing = false;
                    if (state !== STATE.LISTENING) {
                        setOrbState(STATE.IDLE);
                        scheduleRestart(1000);
                    }
                    return;
                }
            }

            // ============================================================
            // STEP 2: LLM FOR COMPLEX QUERIES
            // ============================================================
            conversationHistory.push({ role: 'user', content: query });

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + GROQ_API_KEY
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: conversationHistory,
                        temperature: 0.4,
                        max_tokens: 500,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error('API Error: ' + response.status);
                }

                const data = await response.json();
                let reply = data.choices[0].message.content;

                if (reply.startsWith('TOOL:')) {
                    const toolResult = await executeTool(reply);
                    
                    const toolResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': 'Bearer ' + GROQ_API_KEY
                        },
                        body: JSON.stringify({
                            model: GROQ_MODEL,
                            messages: [
                                { role: 'system', content: SYSTEM_PROMPT },
                                ...conversationHistory,
                                { role: 'assistant', content: reply },
                                { role: 'user', content: 'Tool result: ' + toolResult + '. Now respond naturally with a complete, helpful answer.' }
                            ],
                            temperature: 0.7,
                            max_tokens: 500,
                            stream: false
                        })
                    });
                    const toolData = await toolResponse.json();
                    const finalReply = toolData.choices[0].message.content;
                    conversationHistory.push({ role: 'assistant', content: finalReply });
                    await streamResponse(finalReply);
                } else {
                    conversationHistory.push({ role: 'assistant', content: reply });
                    await streamResponse(reply);
                }

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (state !== STATE.LISTENING) {
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1000);
                }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                toggleListening();
            }
        });

        // ============================================================
        // PRELOAD TTS VOICES
        // ============================================================
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // ============================================================
        // INIT - AUTO START AFTER 1 SECOND
        // ============================================================
        setOrbState(STATE.IDLE);

        const welcomeDiv = document.createElement('div');
        welcomeDiv.className = 'message assistant-msg';
        const ws = document.createElement('span');
        ws.className = 'sender';
        ws.textContent = 'Zishu';
        const wc = document.createElement('span');
        wc.className = 'content';
        wc.textContent = 'Namaste! Main Zishu hoon. Main aapki madad kar sakti hoon. Orb dabayein ya Space press karein aur baat karein.';
        welcomeDiv.appendChild(ws);
        welcomeDiv.appendChild(wc);
        chatContainer.appendChild(welcomeDiv);

        // Auto-start after welcome
        setTimeout(() => {
            if (state === STATE.IDLE) {
                startListening();
            }
        }, 1500);

        console.log('Zishu AI v2.6 - Stable Auto-Start + Instant Commands');
        console.log('Websites:', Object.keys(WEBSITE_MAP).join(', '));
        console.log('Press Space to toggle listening');
    </script>
</body>
