<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI - Voice Assistant</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: white;
        }
        #header {
            font-size: 28px;
            font-weight: bold;
            margin: 20px 0;
            background: linear-gradient(90deg, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 600px;
            overflow-y: auto;
            padding: 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            margin-bottom: 20px;
            scroll-behavior: smooth;
        }
        .message {
            margin: 10px 0;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
        }
        .user-msg {
            background: linear-gradient(135deg, #667eea, #764ba2);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: rgba(255,255,255,0.12);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .typing-indicator {
            color: #aaa;
            font-style: italic;
            margin: 10px 0;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 18px;
            display: inline-block;
        }
        #mic-btn {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: white;
            font-size: 40px;
            cursor: pointer;
            box-shadow: 0 0 30px rgba(245, 87, 108, 0.4);
            transition: all 0.3s ease;
            margin-bottom: 20px;
            position: relative;
        }
        #mic-btn.listening {
            background: linear-gradient(135deg, #4facfe, #00f2fe);
            box-shadow: 0 0 50px rgba(79, 172, 254, 0.6);
            animation: pulse 1.5s infinite;
        }
        #mic-btn:active { transform: scale(0.9); }
        @keyframes pulse {
            0% { box-shadow: 0 0 30px rgba(79, 172, 254, 0.4); }
            50% { box-shadow: 0 0 80px rgba(79, 172, 254, 0.8); }
            100% { box-shadow: 0 0 30px rgba(79, 172, 254, 0.4); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        #status {
            font-size: 14px;
            color: #aaa;
            margin-top: 5px;
        }
        #chat-container::-webkit-scrollbar {
            width: 6px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #667eea;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div id="header">🎙️ Dot Assistant</div>
    <div id="chat-container"></div>
    <button id="mic-btn">🎤</button>
    <div id="status">Tap mic to start speaking</div>

    <script>
        // ============================================================
        // 🔑 YAHAN APNI GROQ API KEY DAALEIN
        // ============================================================
        const GROQ_API_KEY = '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';
        const GROQ_MODEL = 'llama3-8b-8192';

        // ============================================================
        // STATE
        // ============================================================
        let isListening = false;
        let recognition = null;
        let conversationHistory = [
            { role: 'system', content: 'You are a helpful voice assistant named Dot. Speak naturally and concisely. Always respond in Hinglish or Hindi.' }
        ];
        let isProcessing = false;

        const chatContainer = document.getElementById('chat-container');
        const micBtn = document.getElementById('mic-btn');
        const statusEl = document.getElementById('status');

        // ============================================================
        // SPEECH RECOGNITION (WebView + Chrome compatible)
        // ============================================================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = '❌ Your browser does not support speech recognition. Use Chrome on Android.';
                micBtn.disabled = true;
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN'; // Hindi + Hinglish support
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusEl.textContent = '🔴 Listening... speak now';
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                statusEl.textContent = '✍️ Processing...';
                addMessage('You', transcript, 'user-msg');
                processUserQuery(transcript);
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    statusEl.textContent = '❌ Microphone permission denied. Tap mic & allow.';
                } else if (event.error === 'audio-capture') {
                    statusEl.textContent = '❌ No microphone found.';
                } else {
                    statusEl.textContent = `⚠️ Error: ${event.error}. Tap mic again.`;
                }
                stopListening();
            };

            rec.onend = () => {
                stopListening();
                if (!isProcessing) {
                    statusEl.textContent = '🎤 Tap mic to speak';
                }
            };

            return rec;
        }

        // ============================================================
        // MIC BUTTON TOGGLE
        // ============================================================
        micBtn.addEventListener('click', () => {
            if (isProcessing) {
                statusEl.textContent = '⏳ Wait, processing...';
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }

            if (isListening) {
                // Stop listening
                recognition.stop();
                stopListening();
            } else {
                // Start listening
                try {
                    recognition.start();
                } catch (e) {
                    // Sometimes recognition is already started but state is off
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        });

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            if (!isProcessing) {
                statusEl.textContent = '🎤 Tap mic to speak';
            }
        }

        // ============================================================
        // GROQ API CALL
        // ============================================================
        async function processUserQuery(userText) {
            isProcessing = true;
            micBtn.disabled = true;
            statusEl.textContent = '🧠 Thinking...';

            // Add user message to history
            conversationHistory.push({ role: 'user', content: userText });

            // Show typing indicator
            const typingId = showTypingIndicator();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 300,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Groq API Error: ${errorData.error?.message || response.status}`);
                }

                const data = await response.json();
                const assistantReply = data.choices[0].message.content;

                // Remove typing indicator
                removeTypingIndicator(typingId);

                // Add assistant message to chat
                addMessage('Dot', assistantReply, 'assistant-msg');

                // Save to history
                conversationHistory.push({ role: 'assistant', content: assistantReply });

                // Speak using Edge TTS
                await speakText(assistantReply);

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator(typingId);
                addMessage('⚠️ Error', error.message, 'assistant-msg');
                statusEl.textContent = '❌ Error occurred. Try again.';
            } finally {
                isProcessing = false;
                micBtn.disabled = false;
                if (!isListening) {
                    statusEl.textContent = '🎤 Tap mic to speak';
                }
            }
        }

        // ============================================================
        // EDGE TTS (100% FREE, NO API KEY)
        // ============================================================
        async function speakText(text) {
            try {
                statusEl.textContent = '🔊 Speaking...';

                // Use Microsoft Edge TTS API (free, no auth)
                const voice = 'hi-IN-SwaraNeural'; // Hindi female voice
                const speechUrl = `https://api.tts.quest/v1/edge/tts?text=${encodeURIComponent(text)}&voice=${voice}`;

                const response = await fetch(speechUrl);
                if (!response.ok) throw new Error('TTS fetch failed');

                const data = await response.json();
                if (!data.success || !data.audioUrl) throw new Error('TTS error');

                // Play audio
                const audio = new Audio(data.audioUrl);
                audio.play();

                audio.onended = () => {
                    statusEl.textContent = '🎤 Tap mic to speak';
                };

                audio.onerror = () => {
                    statusEl.textContent = '⚠️ TTS playback failed';
                };

            } catch (error) {
                console.error('TTS Error:', error);
                statusEl.textContent = '⚠️ TTS error, but text is on screen.';
                // Fallback: try browser's built-in TTS
                try {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'hi-IN';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {
                    // Silent fallback
                }
            }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function addMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${escapeHtml(text)}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'typing-indicator';
            div.textContent = 'Dot is typing...';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // INIT
        // ============================================================
        addMessage('Dot', 'Namaste! Main aapka voice assistant hoon. Mic dabayein aur baat karein.', 'assistant-msg');
        statusEl.textContent = '🎤 Tap mic to start';
    </script>
</body>
</html>
