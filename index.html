<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI - Voice Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #splash.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        #splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            animation: splashPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.3);
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(59, 130, 246, 0.2); }
            50% { transform: scale(1.06); box-shadow: 0 0 100px rgba(59, 130, 246, 0.4); }
        }
        #splash-title {
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin-top: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        #splash-loader {
            margin-top: 30px;
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        #splash-loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #7b6cf7);
            border-radius: 4px;
            animation: loadBar 2.5s ease-in-out forwards;
        }
        @keyframes loadBar {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        #splash-footer {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }
        #splash-footer .love {
            color: #ef4444;
        }
        #splash-footer .highlight {
            color: rgba(255,255,255,0.6);
        }

        /* ===== CSS VARIABLES ===== */
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface-border: #e9edf4;
            --text-primary: #1a2332;
            --text-secondary: #6b7a8f;
            --text-muted: #9aa9bb;
            --orb-idle: #3b82f6;
            --orb-listening: #4f8ef7;
            --orb-thinking: #7b6cf7;
            --orb-speaking: #3b82f6;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --bubble-user: #3b82f6;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #f1f4f9;
            --bubble-assistant-text: #1a2332;
            --scrollbar-track: #f1f4f9;
            --scrollbar-thumb: #d0d8e3;
            --card-bg: #ffffff;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
            --menu-bg: #ffffff;
            --menu-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --badge-bg: #e9edf4;
            --badge-text: #6b7a8f;
            --quick-btn-bg: #f1f4f9;
            --quick-btn-hover: #e5e9f0;
            --tab-active: #3b82f6;
            --tab-inactive: #6b7a8f;
        }

        [data-theme="dark"] {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface-border: #2a2a3a;
            --text-primary: #e8edf5;
            --text-secondary: #9aa9bb;
            --text-muted: #6b7a8f;
            --orb-idle: #4f8ef7;
            --orb-listening: #6b9cf7;
            --orb-thinking: #8b7cf7;
            --orb-speaking: #4f8ef7;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --bubble-user: #4f8ef7;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #2a2a3a;
            --bubble-assistant-text: #e8edf5;
            --scrollbar-track: #1a1a24;
            --scrollbar-thumb: #3a3a4a;
            --card-bg: #1a1a24;
            --card-shadow: 0 2px 12px rgba(0, 0, 0, 0.2);
            --menu-bg: #1a1a24;
            --menu-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --badge-bg: #2a2a3a;
            --badge-text: #9aa9bb;
            --quick-btn-bg: #2a2a3a;
            --quick-btn-hover: #3a3a4a;
            --tab-active: #4f8ef7;
            --tab-inactive: #6b7a8f;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 6px;
            flex-shrink: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            transition: background 0.3s ease;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #brand svg {
            width: 24px;
            height: 24px;
        }
        #brand h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #theme-toggle, #menu-toggle {
            background: var(--surface-border);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-secondary);
            font-size: 14px;
        }
        #theme-toggle:hover, #menu-toggle:hover {
            background: var(--quick-btn-hover);
            color: var(--text-primary);
        }

        /* ===== ORB ===== */
        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0 6px;
            flex-shrink: 0;
        }
        #orb {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--orb-idle), #1a2332);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        #orb:hover { transform: scale(1.04); }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, var(--orb-listening), #1a2332);
            box-shadow: 0 0 70px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, var(--orb-thinking), #1a2332);
            box-shadow: 0 0 70px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, var(--orb-speaking), #1a2332);
            box-shadow: 0 0 70px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbSpeak { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(1.04) translateY(-3px); } }

        #orb-status {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        #orb-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 1px;
            font-weight: 400;
        }

        /* ===== QUICK ACTIONS ===== */
        #quick-actions {
            display: flex;
            gap: 6px;
            padding: 0 12px 6px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        #quick-actions::-webkit-scrollbar { height: 0; }
        .quick-btn {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid var(--surface-border);
            background: var(--quick-btn-bg);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .quick-btn:hover {
            background: var(--quick-btn-hover);
            color: var(--text-primary);
            border-color: var(--tab-active);
        }
        .quick-btn i { font-size: 11px; }

        /* ===== CHAT ===== */
        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--surface-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 12px 6px;
            transition: background 0.3s ease;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar { width: 3px; }
        #chat-container::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .message {
            margin: 5px 0;
            padding: 8px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.5;
            font-size: 13px;
            font-weight: 400;
        }
        .user-msg {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: var(--bubble-assistant);
            color: var(--bubble-assistant-text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-bottom: 1px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender { color: var(--text-secondary); }
        .user-msg .sender { color: rgba(255,255,255,0.7); }
        .message .content { display: block; }

        .tool-msg {
            background: var(--surface-border);
            color: var(--text-secondary);
            margin: 3px auto;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
        }

        /* ===== FOOTER ===== */
        #footer {
            display: none;
        }

        /* ===== MENU ===== */
        #menu-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            display: none;
            animation: fadeIn 0.2s ease;
        }
        #menu-overlay.open { display: block; }
        #menu-panel {
            position: fixed;
            top: 0;
            right: -380px;
            width: 360px;
            max-width: 90%;
            height: 100%;
            background: var(--menu-bg);
            z-index: 1000;
            overflow-y: auto;
            transition: right 0.3s cubic-bezier(0.4,0,0.2,1);
            box-shadow: var(--menu-shadow);
            padding: 16px 0;
        }
        #menu-panel.open { right: 0; }
        #menu-panel::-webkit-scrollbar { width: 3px; }
        #menu-panel::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .menu-header {
            padding: 0 16px 12px;
            border-bottom: 1px solid var(--surface-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .menu-header h2 { font-size: 16px; font-weight: 700; color: var(--text-primary); }
        .menu-close { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-secondary); }
        .menu-section { padding: 12px 16px; border-bottom: 1px solid var(--surface-border); }
        .menu-section-title {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }
        .menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: var(--text-primary);
            font-size: 13px;
        }
        .menu-item:hover { background: var(--quick-btn-bg); }
        .menu-item i { width: 18px; color: var(--text-secondary); font-size: 14px; }
        .menu-item .badge {
            margin-left: auto;
            font-size: 9px;
            background: var(--badge-bg);
            color: var(--badge-text);
            padding: 1px 8px;
            border-radius: 20px;
        }
        .menu-item.active { background: var(--tab-active); color: white; }
        .menu-item.active i { color: white; }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #orb { width: 56px; height: 56px; }
            #brand h1 { font-size: 15px; }
            #orb-status { font-size: 12px; }
            .message { font-size: 12px; padding: 6px 12px; max-width: 88%; }
            #chat-container { padding: 10px 12px; }
            #quick-actions { padding: 0 8px 4px; gap: 4px; }
            .quick-btn { font-size: 10px; padding: 4px 10px; }
            #header { padding: 6px 12px 4px; }
            #menu-panel { width: 300px; }
            #splash-logo { width: 80px; height: 80px; font-size: 32px; }
            #splash-title { font-size: 24px; }
            #splash-loader { width: 150px; }
        }
    </style>
</head>
<body>

    <!-- ===== SPLASH SCREEN ===== -->
    <div id="splash">
        <div id="splash-logo">
            <i class="fas fa-microphone-alt"></i>
        </div>
        <div id="splash-title">ZISHU</div>
        <div id="splash-sub">Voice Intelligence</div>
        <div id="splash-loader">
            <div id="splash-loader-bar"></div>
        </div>
        <div id="splash-footer">
            made with <span class="love">❤</span> by <span class="highlight">Zishan</span>
        </div>
    </div>

    <!-- ===== HEADER ===== -->
    <div id="header">
        <div id="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.8">
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3b82f6"/>
                    <stop offset="100%" stop-color="#7b6cf7"/>
                </linearGradient></defs>
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 12l2 2 4-4"/>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <h1>ZISHU</h1>
        </div>
        <div id="header-actions">
            <button id="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
            <button id="menu-toggle" aria-label="Menu"><i class="fas fa-bars"></i></button>
        </div>
    </div>

    <!-- ===== ORB ===== -->
    <div id="orb-container">
        <div id="orb"></div>
        <div id="orb-status">Zishu is ready</div>
        <div id="orb-sub">Tap orb or press Space</div>
    </div>

    <!-- ===== QUICK ACTIONS ===== -->
    <div id="quick-actions">
        <button class="quick-btn" data-action="summarize"><i class="fas fa-file-alt"></i> Summarize</button>
        <button class="quick-btn" data-action="study"><i class="fas fa-graduation-cap"></i> Study</button>
        <button class="quick-btn" data-action="quiz"><i class="fas fa-brain"></i> Quiz</button>
        <button class="quick-btn" data-action="notes"><i class="fas fa-sticky-note"></i> Notes</button>
        <button class="quick-btn" data-action="reminders"><i class="fas fa-bell"></i> Reminders</button>
        <button class="quick-btn" data-action="translate"><i class="fas fa-language"></i> Translate</button>
    </div>

    <!-- ===== CHAT ===== -->
    <div id="chat-wrapper">
        <div id="chat-container"></div>
    </div>

    <!-- ===== MENU OVERLAY ===== -->
    <div id="menu-overlay"></div>
    <div id="menu-panel">
        <div class="menu-header">
            <h2><i class="fas fa-cog" style="margin-right:6px;"></i> Settings</h2>
            <button class="menu-close" id="menu-close"><i class="fas fa-times"></i></button>
        </div>

        <!-- Persona -->
        <div class="menu-section">
            <div class="menu-section-title">Persona</div>
            <div class="menu-item active" data-persona="friendly"><i class="fas fa-smile"></i> Friendly <span class="badge">Default</span></div>
            <div class="menu-item" data-persona="teacher"><i class="fas fa-chalkboard-teacher"></i> Teacher</div>
            <div class="menu-item" data-persona="professional"><i class="fas fa-briefcase"></i> Professional</div>
            <div class="menu-item" data-persona="translator"><i class="fas fa-language"></i> Translator</div>
        </div>

        <!-- Language -->
        <div class="menu-section">
            <div class="menu-section-title">Response Language</div>
            <div class="menu-item active" data-lang="hinglish"><i class="fas fa-language"></i> Hinglish</div>
            <div class="menu-item" data-lang="english"><i class="fas fa-language"></i> English</div>
        </div>

        <!-- Memory -->
        <div class="menu-section">
            <div class="menu-section-title">Memory</div>
            <div class="menu-item" onclick="showMemory()"><i class="fas fa-brain"></i> View Memories</div>
            <div class="menu-item" onclick="clearMemory()"><i class="fas fa-trash-alt"></i> Clear Memory</div>
        </div>

        <!-- Tools -->
        <div class="menu-section">
            <div class="menu-section-title">Tools</div>
            <div class="menu-item" onclick="showNotes()"><i class="fas fa-sticky-note"></i> My Notes <span class="badge" id="note-count">0</span></div>
            <div class="menu-item" onclick="showReminders()"><i class="fas fa-bell"></i> Reminders <span class="badge" id="reminder-count">0</span></div>
        </div>
    </div>

    <script>
        // ============================================================
        // SPLASH SCREEN
        // ============================================================
        setTimeout(() => {
            document.getElementById('splash').classList.add('hide');
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                // Auto-start after splash
                setTimeout(startListening, 500);
            }, 800);
        }, 2800);

        // ============================================================
        // CONFIG
        // ============================================================
        const GROQ_API_KEY = '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';
        const GROQ_MODEL = 'llama-3.1-8b-instant';

        // ============================================================
        // STATE
        // ============================================================
        const STATE = { IDLE: 'idle', LISTENING: 'listening', THINKING: 'thinking', SPEAKING: 'speaking' };
        let state = STATE.IDLE;
        let recognition = null;
        let isProcessing = false;
        let currentUtterance = null;
        let restartTimer = null;
        let isRestartScheduled = false;
        let currentPersona = 'friendly';
        let currentLanguage = 'hinglish';
        let conversationHistory = [];

        // ============================================================
        // PERSONA PROMPTS - CLEAN HINGLISH ONLY
        // ============================================================
        const PERSONAS = {
            friendly: {
                prompt: `You are Zishu, a friendly female voice assistant. Always respond in Hinglish only - mix Hindi and English naturally in one sentence. Never use pure English or pure Hindi separately. Use feminine verb endings: "kar sakti hoon", "bol sakti hoon". Be warm, casual, and conversational. Keep responses short and friendly. Example: "Namaste! Main Zishu hoon. Aap kaise ho? How can I help you today?"`,
                label: 'Friendly'
            },
            teacher: {
                prompt: `You are Zishu, a knowledgeable teacher. Always respond in Hinglish only - mix Hindi and English naturally in one sentence. Use feminine verb endings: "samjha sakti hoon". Give clear explanations with examples. Be patient and encouraging. Example: "Yeh concept samajhna easy hai. Let me explain step by step."`,
                label: 'Teacher'
            },
            professional: {
                prompt: `You are Zishu, a professional assistant. Always respond in Hinglish only - mix Hindi and English naturally in one sentence. Use feminine verb endings: "kar sakti hoon". Focus on productivity and getting things done. Example: "Aapka reminder set kar diya hai. I'll notify you at the right time."`,
                label: 'Professional'
            },
            translator: {
                prompt: `You are Zishu, a language translator. Always respond in Hinglish only - mix Hindi and English naturally in one sentence. Help users translate between languages. Be encouraging and patient. Example: "Yeh word ka matlab hai... In English we say..."`,
                label: 'Translator'
            }
        };

        const LANGUAGES = {
            hinglish: 'Always respond in Hinglish - mix Hindi and English naturally in every sentence.',
            english: 'Always respond in English only. Pure English.'
        };

        // ============================================================
        // WEBSITE ALIASES
        // ============================================================

        // ============================================================
        // DOM REFS
        // ============================================================
        const orb = document.getElementById('orb');
        const orbStatus = document.getElementById('orb-status');
        const orbSub = document.getElementById('orb-sub');
        const chatContainer = document.getElementById('chat-container');

        // ============================================================
        // THEME TOGGLE
        // ============================================================
        let isDark = false;
        themeToggle.addEventListener('click', () => {
            isDark = !isDark;
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            themeToggle.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // ============================================================
        // MENU TOGGLE
        // ============================================================
        function toggleMenu(open) {
            menuOverlay.classList.toggle('open', open);
            menuPanel.classList.toggle('open', open);
            document.body.style.overflow = open ? 'hidden' : '';
        }
        menuToggle.addEventListener('click', () => toggleMenu(true));
        menuClose.addEventListener('click', () => toggleMenu(false));
        menuOverlay.addEventListener('click', () => toggleMenu(false));

        // ============================================================
        // PERSONA SELECTION
        // ============================================================
        document.querySelectorAll('[data-persona]').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('[data-persona]').forEach(e => e.classList.remove('active'));
                this.classList.add('active');
                currentPersona = this.dataset.persona;
                updateSystemPrompt();
                addMessage('Zishu', `Ab main ${PERSONAS[currentPersona].label} mode mein hoon. Kya help chahiye?`, 'assistant-msg');
            });
        });

        // ============================================================
        // LANGUAGE SELECTION
        // ============================================================
        document.querySelectorAll('[data-lang]').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('[data-lang]').forEach(e => e.classList.remove('active'));
                this.classList.add('active');
                currentLanguage = this.dataset.lang;
                updateSystemPrompt();
                const langLabel = currentLanguage === 'hinglish' ? 'Hinglish' : 'English';
                addMessage('Zishu', `Language change kar diya hai - ab ${langLabel} mein baat karoonga.`, 'assistant-msg');
            });
        });

        // ============================================================
        // UPDATE SYSTEM PROMPT
        // ============================================================
        function updateSystemPrompt() {
            const personaPrompt = PERSONAS[currentPersona].prompt;
            const langPrompt = LANGUAGES[currentLanguage];
            const fullPrompt = `${personaPrompt}\n\n${langPrompt}\n\nImportant: Always respond in Hinglish only (mix Hindi and English) unless English mode is selected. Never use pure Hindi or pure English separately. Use feminine verb endings. Keep responses natural and conversational.`;

            conversationHistory = [
                { role: 'system', content: fullPrompt }
            ];
            const memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
            if (memory.name) {
                conversationHistory.push({
                    role: 'assistant',
                    content: `I remember your name is ${memory.name}.`
                });
            }
        }

        // ============================================================
        // QUICK ACTIONS
        // ============================================================
        quickBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                const action = this.dataset.action;
                const queries = {
                    'summarize': 'Please summarize this text: [paste your text here]',
                    'study': 'I want to study. Can you help me with my subjects?',
                    'quiz': 'Give me a quick quiz question.',
                    'notes': 'Show me my saved notes.',
                    'reminders': 'Show me my reminders.',
                    'translate': 'Please translate this for me.'
                };
                if (action === 'notes') showNotes();
                else if (action === 'reminders') showReminders();
                else {
                    addMessage('You', queries[action] || 'Help me with this.', 'user-msg');
                    handleUserQuery(queries[action] || 'Help me with this.');
                }
            });
        });

        // ============================================================
        // NOTES & REMINDERS
        // ============================================================
        function showNotes() {
            const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
            if (notes.length === 0) {
                addMessage('Zishu', 'Abhi koi note nahi hai. "create note" bolkar add kar sakte ho.', 'assistant-msg');
                return;
            }
            let msg = '📝 Aapke saved notes:\n\n';
            notes.forEach((n, i) => {
                msg += `${i+1}. ${n.text}\n   📅 ${new Date(n.date).toLocaleDateString()}\n\n`;
            });
            addMessage('Zishu', msg, 'assistant-msg');
        }

        function showReminders() {
            const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
            if (reminders.length === 0) {
                addMessage('Zishu', 'Abhi koi reminder nahi hai. "set reminder" bolkar add kar sakte ho.', 'assistant-msg');
                return;
            }
            let msg = '🔔 Aapke reminders:\n\n';
            reminders.forEach((r, i) => {
                msg += `${i+1}. ${r.text}\n   ⏰ ${r.time}\n\n`;
            });
            addMessage('Zishu', msg, 'assistant-msg');
        }

        function clearMemory() {
            if (confirm('Saari memory clear karni hai?')) {
                localStorage.removeItem('zishu_memory');
                updateSystemPrompt();
                addMessage('Zishu', 'Memory clear ho gayi hai.', 'assistant-msg');
            }
        }

        function showMemory() {
            const memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
            const keys = Object.keys(memory);
            if (keys.length === 0) {
                addMessage('Zishu', 'Abhi koi memory nahi hai.', 'assistant-msg');
                return;
            }
            let msg = '🧠 Saved memories:\n\n';
            keys.forEach(key => {
                msg += `${key}: ${memory[key]}\n`;
            });
            addMessage('Zishu', msg, 'assistant-msg');
        }

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                clearRestartTimer();
                setOrbState(STATE.LISTENING);
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                console.log('🎤 USER SAID:', transcript);
                if (transcript.length > 0) {
                    stopListening();
                    handleUserQuery(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    scheduleRestart(800);
                } else {
                    scheduleRestart(1000);
                }
            };

            rec.onend = () => {
                if (state === STATE.LISTENING && !isProcessing && !isRestartScheduled) {
                    scheduleRestart(300);
                } else if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                }
            };

            return rec;
        }

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;
            const statusMap = {
                idle: ['Zishu is ready', 'Tap orb or press Space'],
                listening: ['Listening...', 'Speak now'],
                thinking: ['Thinking...', 'Processing...'],
                speaking: ['Speaking...', 'Zishu is responding']
            };
            const [status, sub] = statusMap[newState] || statusMap.idle;
            orbStatus.textContent = status;
            orbSub.textContent = sub;
        }

        orb.addEventListener('click', toggleListening);

        function toggleListening() {
            if (isProcessing) return;
            if (state === STATE.IDLE || state === STATE.SPEAKING) startListening();
            else if (state === STATE.LISTENING) stopListening();
        }

        function startListening() {
            clearRestartTimer();
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                try { recognition.stop(); } catch (ex) {}
                setTimeout(() => {
                    try { recognition.start(); } catch (ex) {}
                }, 200);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) setOrbState(STATE.IDLE);
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(() => {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
        }

        // ============================================================
        // LOCAL COMMAND DETECTION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();
            const openWords = ['open', 'kholo', 'khol', 'chalao', 'start', 'launch', 'go to', 'खोलो', 'खोल', 'चलाओ', 'शुरू करो'];

            for (const [site, aliases] of Object.entries(SITE_ALIASES)) {
                const siteFound = aliases.some(alias => q.includes(alias));
                if (!siteFound) continue;
                const wantsOpen = openWords.some(word => q.includes(word)) || q === site;
                if (wantsOpen) {
                    return { type: 'open_website', value: site };
                }
            }

            // Weather
            if (q.includes('weather') || q.includes('mausam') || q.includes('मौसम')) {
                const cityMatch = q.match(/(?:weather|mausam|मौसम)\s+(?:in|of|for|का|की|में)?\s*([a-zA-Z\u0900-\u097F\s]+)/);
                return { type: 'weather', value: cityMatch ? cityMatch[1].trim() : 'Delhi' };
            }

            // Time
            if (q.includes('time') || q.includes('samay') || q.includes('समय') || q.includes('kya') && q.includes('baje')) {
                return { type: 'time' };
            }

            // Calculate
            if (q.includes('calculate') || q.includes('solve') || q.includes('हल') || q.includes('गणना')) {
                const expr = q.replace(/calculate|solve|हल|गणना|करो|karo/g, '').trim();
                if (expr) return { type: 'calculate', value: expr };
            }

            return null;
        }

        // ============================================================
        // OPEN WEBSITE
        // ============================================================
        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }
            addToolMessage('Opening ' + siteName + '...');
            try {
                window.location.assign(url);
                return true;
            } catch (e) {
                try { window.location.href = url; return true; } catch (e2) {
                    try {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        return true;
                    } catch (e3) {
                        addToolMessage('Could not open ' + siteName);
                        return false;
                    }
                }
            }
        }

        // ============================================================
        // TOOL FUNCTIONS
        // ============================================================
        async function getWeather(city) {
            try {
                const response = await fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=%C+%t');
                const data = await response.text();
                return data.trim() || 'Weather data unavailable';
            } catch {
                return 'Could not fetch weather.';
            }
        }

        function addToolMessage(text) {
            const div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // ADD MESSAGE
        // ============================================================
        function addMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = sender;
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = text;
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // STREAM RESPONSE
        // ============================================================
        async function streamResponse(text) {
            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            let accumulated = '';
            for (let i = 0; i < text.length; i++) {
                accumulated += text[i];
                contentSpan.textContent = accumulated;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 10 + Math.random() * 6));
            }

            speakText(text);
            return msgDiv;
        }

        // ============================================================
        // TTS
        // ============================================================
        function speakText(text) {
            try {
                if (currentUtterance) window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                utterance.volume = 1;

                const voices = window.speechSynthesis.getVoices();
                const femaleVoices = voices.filter(v =>
                    v.lang.startsWith('hi') &&
                    (v.name.toLowerCase().includes('female') ||
                     v.name.toLowerCase().includes('swara') ||
                     v.name.toLowerCase().includes('lekh'))
                );
                if (femaleVoices.length > 0) utterance.voice = femaleVoices[0];
                else {
                    const hindiVoice = voices.find(v => v.lang.startsWith('hi'));
                    if (hindiVoice) utterance.voice = hindiVoice;
                }

                utterance.onstart = () => setOrbState(STATE.SPEAKING);
                utterance.onend = () => {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
                };
                utterance.onerror = () => {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('TTS error:', error);
                if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
            }
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            addMessage('You', query, 'user-msg');

            // ============================================================
            // LOCAL COMMANDS
            // ============================================================
            const localCmd = detectLocalCommand(query);
            if (localCmd) {
                if (localCmd.type === 'open_website') {
                    openWebsiteDirectly(localCmd.value);
                    isProcessing = false;
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1200);
                    return;
                } else if (localCmd.type === 'weather') {
                    const weather = await getWeather(localCmd.value || 'Delhi');
                    const reply = `Weather in ${localCmd.value || 'Delhi'}: ${weather}`;
                    addMessage('Zishu', reply, 'assistant-msg');
                    speakText(reply);
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                } else if (localCmd.type === 'time') {
                    const now = new Date();
                    const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    const reply = `Current time is ${time}`;
                    addMessage('Zishu', reply, 'assistant-msg');
                    speakText(reply);
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                } else if (localCmd.type === 'calculate') {
                    try {
                        const result = Function('"use strict"; return (' + localCmd.value + ')')();
                        const reply = `Result: ${result}`;
                        addMessage('Zishu', reply, 'assistant-msg');
                        speakText(reply);
                    } catch (e) {
                        addMessage('Zishu', 'Could not calculate that.', 'assistant-msg');
                    }
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                }
            }

            // ============================================================
            // LLM QUERY
            // ============================================================
            conversationHistory.push({ role: 'user', content: query });

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + GROQ_API_KEY
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 500,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error('API Error: ' + response.status);

                const data = await response.json();
                let reply = data.choices[0].message.content;

                // Clean any mixed language issues
                reply = reply.replace(/\b(beta|son|child|baby)\b/gi, '').trim();

                conversationHistory.push({ role: 'assistant', content: reply });

                // Save memory
                const memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
                const nameMatch = reply.match(/(?:your name is|aapka naam|tumhara naam|mera naam)\s+([a-zA-Z\u0900-\u097F\s]+)/i);
                if (nameMatch && !memory.name) {
                    memory.name = nameMatch[1].trim();
                    localStorage.setItem('zishu_memory', JSON.stringify(memory));
                }

                await streamResponse(reply);

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (state !== STATE.LISTENING) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                toggleListening();
            }
        });

        // ============================================================
        // PRELOAD TTS
        // ============================================================
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // ============================================================
        // INIT
        // ============================================================
        updateSystemPrompt();
        setOrbState(STATE.IDLE);
        addMessage('Zishu', 'Namaste! Main Zishu hoon. Main Hinglish mein baat karti hoon - Hindi aur English mix. Kya help chahiye aapko?', 'assistant-msg');

        // Update counts
        const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
        const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
        document.getElementById('note-count').textContent = notes.length;
        document.getElementById('reminder-count').textContent = reminders.length;

        console.log('🚀 Zishu AI v3.1 - Splash + Clean Hinglish');
        console.log('📝 Persona:', currentPersona, '| Language:', currentLanguage);
        console.log('🌐 Websites:', Object.keys(WEBSITE_MAP).length);
    </script>
