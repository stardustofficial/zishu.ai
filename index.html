<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI - Voice Assistant</title>
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface-border: #e9edf4;
            --text-primary: #1a2332;
            --text-secondary: #6b7a8f;
            --text-muted: #9aa9bb;
            --orb-idle: #3b82f6;
            --orb-listening: #4f8ef7;
            --orb-thinking: #7b6cf7;
            --orb-speaking: #3b82f6;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --bubble-user: #3b82f6;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #f1f4f9;
            --bubble-assistant-text: #1a2332;
            --scrollbar-track: #f1f4f9;
            --scrollbar-thumb: #d0d8e3;
        }

        [data-theme="dark"] {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface-border: #2a2a3a;
            --text-primary: #e8edf5;
            --text-secondary: #9aa9bb;
            --text-muted: #6b7a8f;
            --orb-idle: #4f8ef7;
            --orb-listening: #6b9cf7;
            --orb-thinking: #8b7cf7;
            --orb-speaking: #4f8ef7;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --bubble-user: #4f8ef7;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #2a2a3a;
            --bubble-assistant-text: #e8edf5;
            --scrollbar-track: #1a1a24;
            --scrollbar-thumb: #3a3a4a;
        }

        /* ===== RESET ===== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 20px 12px;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        #header {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 4px;
            flex-shrink: 0;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #brand svg {
            width: 28px;
            height: 28px;
        }
        #brand h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--orb-idle), var(--orb-thinking));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #brand .sub {
            font-size: 11px;
            font-weight: 450;
            color: var(--text-secondary);
            -webkit-text-fill-color: var(--text-secondary);
            background: none;
        }
        #theme-toggle {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow);
            flex-shrink: 0;
        }
        #theme-toggle svg {
            width: 20px;
            height: 20px;
            stroke: var(--text-secondary);
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }
        #theme-toggle:hover svg { stroke: var(--text-primary); }

        /* ===== ORB CONTAINER ===== */
        #orb-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 0 12px;
            flex-shrink: 0;
            position: relative;
        }
        #orb {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--orb-idle), #1a2332);
            box-shadow: 0 0 60px rgba(59, 130, 246, 0.15);
            transition: all 0.5s ease;
            position: relative;
            cursor: pointer;
        }
        #orb::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 50%;
            border: 2px solid transparent;
            transition: all 0.5s ease;
        }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, var(--orb-listening), #1a2332);
            box-shadow: 0 0 80px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.listening::after {
            border-color: var(--orb-listening);
            animation: ringPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, var(--orb-thinking), #1a2332);
            box-shadow: 0 0 80px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, var(--orb-speaking), #1a2332);
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.04); }
        }
        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.15); opacity: 0.8; }
        }
        @keyframes orbSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes orbSpeak {
            0% { transform: scale(1) translateY(0); }
            100% { transform: scale(1.06) translateY(-4px); }
        }

        #orb-status {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
            transition: color 0.3s ease;
            min-height: 22px;
        }
        #orb-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
            min-height: 18px;
        }

        /* ===== CHAT CONTAINER (Compact) ===== */
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 700px;
            overflow-y: auto;
            padding: 12px 16px;
            background: var(--surface);
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--surface-border);
            margin-top: 8px;
            scroll-behavior: smooth;
            transition: background 0.3s ease, border-color 0.3s ease;
            min-height: 0;
        }
        #chat-container::-webkit-scrollbar { width: 4px; }
        #chat-container::-webkit-scrollbar-track { background: var(--scrollbar-track); border-radius: 10px; }
        #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .message {
            margin: 6px 0;
            padding: 10px 16px;
            border-radius: 16px;
            max-width: 78%;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease;
            line-height: 1.5;
            font-size: 14px;
            font-weight: 420;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
            transition: background 0.3s ease, color 0.3s ease;
        }
        .user-msg {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: var(--bubble-assistant);
            color: var(--bubble-assistant-text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 11px;
            opacity: 0.6;
            display: block;
            margin-bottom: 2px;
        }
        .assistant-msg .sender { color: var(--text-secondary); }
        .user-msg .sender { color: rgba(255,255,255,0.7); }

        .tool-msg {
            background: var(--surface-border);
            color: var(--text-secondary);
            margin: 4px auto;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            text-align: center;
            max-width: 90%;
            font-weight: 450;
        }

        .typing-indicator {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 6px 0;
            padding: 8px 16px;
            background: var(--bubble-assistant);
            border-radius: 30px;
            display: inline-block;
            animation: fadeIn 0.3s ease;
            transition: background 0.3s ease;
        }

        /* ===== FOOTER ===== */
        #footer {
            width: 100%;
            max-width: 700px;
            display: flex;
            justify-content: space-between;
            padding: 8px 4px 0;
            flex-shrink: 0;
            font-size: 11px;
            color: var(--text-muted);
            letter-spacing: 0.2px;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #orb { width: 96px; height: 96px; }
            #brand h1 { font-size: 17px; }
            #brand .sub { font-size: 10px; }
            #orb-status { font-size: 13px; }
            .message { font-size: 13px; padding: 8px 14px; max-width: 86%; }
            #chat-container { padding: 10px 12px; }
            #theme-toggle { width: 34px; height: 34px; }
            #theme-toggle svg { width: 18px; height: 18px; }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <div id="header">
        <div id="brand">
            <svg viewBox="0 0 24 24" fill="none" stroke="url(#grad)" stroke-width="1.8">
                <defs><linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#3b82f6"/>
                    <stop offset="100%" stop-color="#7b6cf7"/>
                </linearGradient></defs>
                <circle cx="12" cy="12" r="10"/>
                <path d="M8 12l2 2 4-4"/>
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <div>
                <h1>ZISHU</h1>
                <span class="sub">voice intelligence</span>
            </div>
        </div>
        <button id="theme-toggle" aria-label="Toggle theme">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </button>
    </div>

    <!-- ===== ORB ===== -->
    <div id="orb-container">
        <div id="orb"></div>
        <div id="orb-status">Tap orb or speak</div>
        <div id="orb-sub">Zishu is idle</div>
    </div>

    <!-- ===== CHAT ===== -->
    <div id="chat-container"></div>

    <!-- ===== FOOTER ===== -->
    <div id="footer">
        <span>your conversations aren't stored</span>
        <span>v2.0 · local</span>
    </div>

    <script>
        // ============================================================
        // CONFIG
        // ============================================================
        const GROQ_API_KEY = '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';
        const GROQ_MODEL = 'llama-3.1-8b-instant';
        const WAKE_WORDS = ['zishu', 'zishu', 'hey zishu', 'ok zishu'];

        // ============================================================
        // STATE
        // ============================================================
        let state = 'idle'; // idle | listening | thinking | speaking
        let recognition = null;
        let isManualMode = false;
        let conversationHistory = [
            { role: 'system', content: `You are Zishu, a voice assistant. 
            You have access to these tools:
            1. open_website(url) - opens any website
            2. set_reminder(text, time) - sets reminder
            3. create_note(text) - saves note
            4. get_weather(city) - gets weather
            5. get_time(city) - gets current time
            6. calculate(expression) - does math
            7. translate(text, language) - translates text
            
            If user asks for any action, respond with: TOOL: tool_name(params)
            Otherwise respond naturally in Hinglish or Hindi.
            Keep responses concise.` }
        ];
        let memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
        let isProcessing = false;
        let currentUtterance = null;

        // ============================================================
        // DOM REFS
        // ============================================================
        const orb = document.getElementById('orb');
        const orbStatus = document.getElementById('orb-status');
        const orbSub = document.getElementById('orb-sub');
        const chatContainer = document.getElementById('chat-container');
        const themeToggle = document.getElementById('theme-toggle');

        // ============================================================
        // THEME
        // ============================================================
        let currentTheme = 'light';
        themeToggle.addEventListener('click', () => {
            const newTheme = currentTheme === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', newTheme);
            currentTheme = newTheme;
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            const svg = themeToggle.querySelector('svg');
            if (theme === 'dark') {
                svg.innerHTML = `<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>`;
            } else {
                svg.innerHTML = `<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>`;
            }
        }

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;
            const statusMap = {
                idle: ['Zishu is idle', 'Tap orb or speak'],
                listening: ['Listening...', 'Speak now'],
                thinking: ['Thinking...', 'Processing your request'],
                speaking: ['Speaking...', 'Zishu is responding']
            };
            const [status, sub] = statusMap[newState] || statusMap.idle;
            orbStatus.textContent = status;
            orbSub.textContent = sub;
        }

        orb.addEventListener('click', () => {
            if (isProcessing) return;
            if (state === 'idle' || state === 'speaking') {
                startListening();
            } else if (state === 'listening') {
                stopListening();
            }
        });

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) {
                orbStatus.textContent = 'Browser not supported';
                return null;
            }
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = true;
            rec.interimResults = true;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                setOrbState('listening');
                isManualMode = false;
            };

            rec.onresult = (event) => {
                let finalText = '';
                let interimText = '';
                for (let i = event.resultIndex; i < event.results.length; i++) {
                    const transcript = event.results[i][0].transcript.toLowerCase().trim();
                    if (event.results[i].isFinal) {
                        finalText = transcript;
                    } else {
                        interimText = transcript;
                    }
                }

                // Wake word detection
                if (finalText && !isProcessing) {
                    const hasWakeWord = WAKE_WORDS.some(w => finalText.includes(w));
                    if (hasWakeWord) {
                        const query = finalText.replace(new RegExp(WAKE_WORDS.join('|'), 'gi'), '').trim();
                        if (query.length > 0) {
                            handleUserQuery(query);
                        } else {
                            orbSub.textContent = 'Say something...';
                        }
                    } else if (isManualMode) {
                        handleUserQuery(finalText);
                    }
                }
            };

            rec.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                } else if (event.error !== 'no-speech') {
                    orbStatus.textContent = 'Error: ' + event.error;
                }
                if (state === 'listening') {
                    setTimeout(() => { if (state === 'listening') startListening(); }, 300);
                }
            };

            rec.onend = () => {
                if (state === 'listening' && !isProcessing) {
                    // Auto-restart for continuous listening
                    try { rec.start(); } catch (e) {}
                } else if (!isProcessing) {
                    setOrbState('idle');
                }
            };

            return rec;
        }

        function startListening() {
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                isManualMode = true;
                setOrbState('listening');
            } catch (e) {
                try { recognition.stop(); } catch (ex) {}
                setTimeout(() => recognition.start(), 200);
            }
        }

        function stopListening() {
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) setOrbState('idle');
        }

        // ============================================================
        // TOOL SYSTEM
        // ============================================================
        async function executeTool(toolString) {
            try {
                const match = toolString.match(/TOOL:\s*(\w+)\((.*)\)/);
                if (!match) return null;
                const [, toolName, params] = match;
                const args = params ? params.split(',').map(s => s.trim().replace(/^['"]|['"]$/g, '')) : [];

                addToolMessage(`Executing ${toolName}...`);

                switch (toolName) {
                    case 'open_website':
                        const url = args[0] || 'https://google.com';
                        window.open(url, '_blank');
                        return `Opened ${url}`;
                    
                    case 'set_reminder':
                        const reminder = { text: args[0], time: args[1] || 'now' };
                        const reminders = JSON.parse(localStorage.getItem('zishu_reminders') || '[]');
                        reminders.push(reminder);
                        localStorage.setItem('zishu_reminders', JSON.stringify(reminders));
                        return `Reminder set: ${reminder.text} at ${reminder.time}`;
                    
                    case 'create_note':
                        const note = args[0] || 'empty note';
                        const notes = JSON.parse(localStorage.getItem('zishu_notes') || '[]');
                        notes.push({ text: note, date: new Date().toISOString() });
                        localStorage.setItem('zishu_notes', JSON.stringify(notes));
                        return `Note saved: ${note}`;
                    
                    case 'get_weather':
                        const city = args[0] || 'Delhi';
                        const weatherData = await fetchWeather(city);
                        return `Weather in ${city}: ${weatherData}`;
                    
                    case 'get_time':
                        const tz = args[0] || 'Asia/Kolkata';
                        const time = new Date().toLocaleString('en-US', { timeZone: tz, hour: '2-digit', minute: '2-digit' });
                        return `Current time in ${tz.split('/').pop()}: ${time}`;
                    
                    case 'calculate':
                        const expr = args[0] || '0';
                        const result = Function('"use strict"; return (' + expr + ')')();
                        return `Result: ${result}`;
                    
                    case 'translate':
                        const text = args[0] || '';
                        const lang = args[1] || 'English';
                        // Simple mock translation - in production use a real API
                        return `Translated to ${lang}: ${text} (mock translation)`;
                    
                    default:
                        return `Tool ${toolName} not recognized`;
                }
            } catch (error) {
                return `Tool error: ${error.message}`;
            }
        }

        async function fetchWeather(city) {
            try {
                const response = await fetch(`https://wttr.in/${encodeURIComponent(city)}?format=%C+%t`);
                const data = await response.text();
                return data.trim() || 'Weather data unavailable';
            } catch {
                return 'Could not fetch weather. Please try again.';
            }
        }

        function addToolMessage(text) {
            const div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // MEMORY SYSTEM
        // ============================================================
        function updateMemory(key, value) {
            memory[key] = value;
            localStorage.setItem('zishu_memory', JSON.stringify(memory));
        }

        function getMemory(key) {
            return memory[key] || null;
        }

        // ============================================================
        // STREAMING RESPONSE
        // ============================================================
        async function streamResponse(text) {
            setOrbState('speaking');
            
            // Add assistant message bubble
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);
            
            // Stream text character by character
            let accumulatedText = '';
            for (let i = 0; i < text.length; i++) {
                accumulatedText += text[i];
                contentSpan.textContent = accumulatedText;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                // Speed control
                await new Promise(r => setTimeout(r, 15 + Math.random() * 10));
            }

            // Speak the full text
            speakText(text);
            return msgDiv;
        }

        // ============================================================
        // TTS with interruption support
        // ============================================================
        function speakText(text) {
            try {
                if (currentUtterance) {
                    window.speechSynthesis.cancel();
                }
                
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.85;
                utterance.pitch = 1.0;
                utterance.volume = 1;

                const voices = window.speechSynthesis.getVoices();
                const hindiVoice = voices.find(v => v.lang.startsWith('hi'));
                if (hindiVoice) utterance.voice = hindiVoice;

                utterance.onstart = () => {
                    setOrbState('speaking');
                };

                utterance.onend = () => {
                    currentUtterance = null;
                    if (!isProcessing) setOrbState('idle');
                };

                utterance.onerror = () => {
                    currentUtterance = null;
                    if (!isProcessing) setOrbState('idle');
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);

            } catch (error) {
                console.error('TTS error:', error);
                if (!isProcessing) setOrbState('idle');
            }
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            setOrbState('thinking');

            // Add user message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'You';
            const contentSpan = document.createElement('span');
            contentSpan.textContent = query;
            userDiv.appendChild(senderSpan);
            userDiv.appendChild(contentSpan);
            chatContainer.appendChild(userDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Add to history
            conversationHistory.push({ role: 'user', content: query });

            // Check for tool invocation via LLM
            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: conversationHistory,
                        temperature: 0.3,
                        max_tokens: 200,
                        stream: false
                    })
                });

                if (!response.ok) {
                    throw new Error(`API Error: ${response.status}`);
                }

                const data = await response.json();
                const reply = data.choices[0].message.content;

                // Check if it's a tool command
                if (reply.startsWith('TOOL:')) {
                    const toolResult = await executeTool(reply);
                    const toolResponse = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${GROQ_API_KEY}`
                        },
                        body: JSON.stringify({
                            model: GROQ_MODEL,
                            messages: [
                                ...conversationHistory,
                                { role: 'assistant', content: reply },
                                { role: 'user', content: `Tool result: ${toolResult}. Now respond naturally.` }
                            ],
                            temperature: 0.7,
                            max_tokens: 150,
                            stream: false
                        })
                    });
                    const toolData = await toolResponse.json();
                    const finalReply = toolData.choices[0].message.content;
                    conversationHistory.push({ role: 'assistant', content: finalReply });
                    await streamResponse(finalReply);
                } else {
                    conversationHistory.push({ role: 'assistant', content: reply });
                    await streamResponse(reply);
                }

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState('idle');
            } finally {
                isProcessing = false;
                if (state !== 'listening') setOrbState('idle');
            }
        }

        // ============================================================
        // INIT
        // ============================================================
        setOrbState('idle');
        
        // Preload TTS voices
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // Auto-start listening after short delay
        setTimeout(() => {
            startListening();
        }, 1000);

        // ============================================================
        // KEYBOARD SHORTCUT: Space to toggle listening
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat) {
                e.preventDefault();
                if (state === 'idle' || state === 'speaking') {
                    startListening();
                } else if (state === 'listening') {
                    stopListening();
                }
            }
        });

        console.log('Zishu AI v2.0 loaded');
        console.log('Memory:', memory);
        console.log('Press Space to toggle listening');
    </script>
</body>
</html>
