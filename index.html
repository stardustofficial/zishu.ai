<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zishu AI - Voice Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f7fc;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #1a2332;
        }
        #header {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0 10px;
            color: #1a2332;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #header span {
            background: #eef2f7;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 500;
            color: #3b82f6;
        }
        #chat-container {
            flex: 1;
            width: 100%;
            max-width: 700px;
            overflow-y: auto;
            padding: 20px 15px;
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            margin-bottom: 20px;
            scroll-behavior: smooth;
            border: 1px solid #e9edf4;
        }
        .message {
            margin: 12px 0;
            padding: 14px 20px;
            border-radius: 20px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.3s ease;
            line-height: 1.5;
            font-size: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }
        .user-msg {
            background: #3b82f6;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }
        .assistant-msg {
            background: #f1f4f9;
            color: #1a2332;
            margin-right: auto;
            border-bottom-left-radius: 6px;
        }
        .typing-indicator {
            color: #6b7a8f;
            font-size: 14px;
            margin: 10px 0;
            padding: 10px 18px;
            background: #f1f4f9;
            border-radius: 30px;
            display: inline-block;
        }
        #mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: none;
            background: #ffffff;
            color: #1a2332;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(59, 130, 246, 0.15);
            transition: all 0.25s ease;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #e9edf4;
        }
        #mic-btn svg {
            width: 32px;
            height: 32px;
            fill: none;
            stroke: #1a2332;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.25s ease;
        }
        #mic-btn.listening {
            background: #3b82f6;
            border-color: #3b82f6;
            box-shadow: 0 0 0 6px rgba(59, 130, 246, 0.2);
        }
        #mic-btn.listening svg {
            stroke: white;
        }
        #mic-btn:active {
            transform: scale(0.92);
        }
        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.3);
            }
            70% {
                box-shadow: 0 0 0 16px rgba(59, 130, 246, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(59, 130, 246, 0);
            }
        }
        #mic-btn.listening {
            animation: pulse 1.6s infinite;
        }
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        #status {
            font-size: 14px;
            color: #6b7a8f;
            margin-top: 4px;
            font-weight: 450;
            letter-spacing: 0.2px;
        }
        #chat-container::-webkit-scrollbar {
            width: 5px;
        }
        #chat-container::-webkit-scrollbar-track {
            background: #f1f4f9;
            border-radius: 10px;
        }
        #chat-container::-webkit-scrollbar-thumb {
            background: #d0d8e3;
            border-radius: 10px;
        }
        .footer-note {
            font-size: 12px;
            color: #9aa9bb;
            margin-top: 6px;
        }
    </style>
</head>
<body>
    <div id="header">
        🎙️ Zishu AI
        <span>Beta</span>
    </div>
    <div id="chat-container"></div>

    <!-- New SVG Mic Button -->
    <button id="mic-btn" aria-label="Microphone">
        <svg viewBox="0 0 24 24" width="32" height="32">
            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" y1="19" x2="12" y2="23" />
            <line x1="8" y1="23" x2="16" y2="23" />
        </svg>
    </button>

    <div id="status">Tap mic to start speaking</div>
    <div class="footer-note">🔒 Your data stays private</div>

    <script>
        // ============================================================
        // 🔑 YOUR GROQ API KEY
        // ============================================================
        const GROQ_API_KEY = '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';
        // UPDATED: Using the recommended replacement model
        const GROQ_MODEL = 'llama-3.1-8b-instant';

        // ============================================================
        // STATE
        // ============================================================
        let isListening = false;
        let recognition = null;
        let conversationHistory = [
            { role: 'system', content: 'You are a helpful voice assistant named Zishu. Speak naturally and concisely. Always respond in Hinglish or Hindi.' }
        ];
        let isProcessing = false;

        const chatContainer = document.getElementById('chat-container');
        const micBtn = document.getElementById('mic-btn');
        const statusEl = document.getElementById('status');

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                statusEl.textContent = '❌ Browser not supported. Use Chrome on Android.';
                micBtn.disabled = true;
                return null;
            }

            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                isListening = true;
                micBtn.classList.add('listening');
                statusEl.textContent = '🔴 Listening... speak now';
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                statusEl.textContent = '✍️ Processing...';
                addMessage('You', transcript, 'user-msg');
                processUserQuery(transcript);
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    statusEl.textContent = '❌ Microphone access denied. Tap mic & allow.';
                } else if (event.error === 'audio-capture') {
                    statusEl.textContent = '❌ No microphone found.';
                } else {
                    statusEl.textContent = `⚠️ Error: ${event.error}. Tap mic again.`;
                }
                stopListening();
            };

            rec.onend = () => {
                stopListening();
                if (!isProcessing) {
                    statusEl.textContent = '🎤 Tap mic to speak';
                }
            };

            return rec;
        }

        // ============================================================
        // MIC BUTTON TOGGLE
        // ============================================================
        micBtn.addEventListener('click', () => {
            if (isProcessing) {
                statusEl.textContent = '⏳ Please wait...';
                return;
            }

            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }

            if (isListening) {
                recognition.stop();
                stopListening();
            } else {
                try {
                    recognition.start();
                } catch (e) {
                    recognition.stop();
                    setTimeout(() => recognition.start(), 200);
                }
            }
        });

        function stopListening() {
            isListening = false;
            micBtn.classList.remove('listening');
            if (!isProcessing) {
                statusEl.textContent = '🎤 Tap mic to speak';
            }
        }

        // ============================================================
        // GROQ API CALL (with updated model)
        // ============================================================
        async function processUserQuery(userText) {
            isProcessing = true;
            micBtn.disabled = true;
            statusEl.textContent = '🧠 Thinking...';

            conversationHistory.push({ role: 'user', content: userText });

            const typingId = showTypingIndicator();

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${GROQ_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: conversationHistory,
                        temperature: 0.7,
                        max_tokens: 300,
                        stream: false
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(`Groq API Error: ${errorData.error?.message || response.status}`);
                }

                const data = await response.json();
                const assistantReply = data.choices[0].message.content;

                removeTypingIndicator(typingId);
                addMessage('Zishu', assistantReply, 'assistant-msg');
                conversationHistory.push({ role: 'assistant', content: assistantReply });

                await speakText(assistantReply);

            } catch (error) {
                console.error('Error:', error);
                removeTypingIndicator(typingId);
                addMessage('⚠️ Error', error.message, 'assistant-msg');
                statusEl.textContent = '❌ Error occurred. Try again.';
            } finally {
                isProcessing = false;
                micBtn.disabled = false;
                if (!isListening) {
                    statusEl.textContent = '🎤 Tap mic to speak';
                }
            }
        }

        // ============================================================
        // EDGE TTS (FREE)
        // ============================================================
        async function speakText(text) {
            try {
                statusEl.textContent = '🔊 Speaking...';
                const voice = 'hi-IN-SwaraNeural';
                const speechUrl = `https://api.tts.quest/v1/edge/tts?text=${encodeURIComponent(text)}&voice=${voice}`;

                const response = await fetch(speechUrl);
                if (!response.ok) throw new Error('TTS fetch failed');

                const data = await response.json();
                if (!data.success || !data.audioUrl) throw new Error('TTS error');

                const audio = new Audio(data.audioUrl);
                audio.play();

                audio.onended = () => {
                    statusEl.textContent = '🎤 Tap mic to speak';
                };

                audio.onerror = () => {
                    statusEl.textContent = '⚠️ TTS playback failed';
                };

            } catch (error) {
                console.error('TTS Error:', error);
                statusEl.textContent = '⚠️ TTS error, but text is on screen.';
                try {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'hi-IN';
                    utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                } catch (e) {}
            }
        }

        // ============================================================
        // UI HELPERS
        // ============================================================
        function addMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerHTML = `<strong>${sender}:</strong> ${escapeHtml(text)}`;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function showTypingIndicator() {
            const id = 'typing-' + Date.now();
            const div = document.createElement('div');
            div.id = id;
            div.className = 'typing-indicator';
            div.textContent = 'Zishu is typing...';
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeTypingIndicator(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // INIT
        // ============================================================
        addMessage('Zishu', 'Namaste! Main aapka voice assistant hoon. Mic dabayein aur baat karein.', 'assistant-msg');
        statusEl.textContent = '🎤 Tap mic to start';
    </script>
</body>
</html>
