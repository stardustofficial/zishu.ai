<html lang="hi">

        /* ===== SPLASH SCREEN ===== */
        #splash {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #splash.hide {
            opacity: 0;
            transform: scale(1.05);
            pointer-events: none;
        }
        #splash-logo {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            animation: splashPulse 1.5s ease-in-out infinite;
            box-shadow: 0 0 80px rgba(59, 130, 246, 0.3);
        }
        @keyframes splashPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(59, 130, 246, 0.2); }
            50% { transform: scale(1.06); box-shadow: 0 0 100px rgba(59, 130, 246, 0.4); }
        }
        #splash-title {
            font-size: 32px;
            font-weight: 900;
            color: white;
            margin-top: 24px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #splash-sub {
            font-size: 14px;
            color: rgba(255,255,255,0.5);
            margin-top: 4px;
            letter-spacing: 2px;
            font-weight: 300;
        }
        #splash-loader {
            margin-top: 30px;
            width: 200px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            overflow: hidden;
        }
        #splash-loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3b82f6, #7b6cf7);
            border-radius: 4px;
            animation: loadBar 2.5s ease-in-out forwards;
        }
        @keyframes loadBar {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        #splash-footer {
            position: absolute;
            bottom: 30px;
            font-size: 13px;
            color: rgba(255,255,255,0.3);
            letter-spacing: 0.5px;
        }
        #splash-footer .love {
            color: #ef4444;
        }
        #splash-footer .highlight {
            color: rgba(255,255,255,0.6);
        }

        /* ===== CSS VARIABLES ===== */
        :root {
            --bg: #f4f7fc;
            --surface: #ffffff;
            --surface-border: #e9edf4;
            --text-primary: #1a2332;
            --text-secondary: #6b7a8f;
            --text-muted: #9aa9bb;
            --orb-idle: #3b82f6;
            --orb-listening: #4f8ef7;
            --orb-thinking: #7b6cf7;
            --orb-speaking: #3b82f6;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            --bubble-user: #3b82f6;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #f1f4f9;
            --bubble-assistant-text: #1a2332;
            --scrollbar-track: #f1f4f9;
            --scrollbar-thumb: #d0d8e3;
            --menu-bg: #ffffff;
            --menu-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --badge-bg: #e9edf4;
            --badge-text: #6b7a8f;
            --quick-btn-bg: #f1f4f9;
            --quick-btn-hover: #e5e9f0;
            --tab-active: #3b82f6;
        }

        [data-theme="dark"] {
            --bg: #0f0f13;
            --surface: #1a1a24;
            --surface-border: #2a2a3a;
            --text-primary: #e8edf5;
            --text-secondary: #9aa9bb;
            --text-muted: #6b7a8f;
            --orb-idle: #4f8ef7;
            --orb-listening: #6b9cf7;
            --orb-thinking: #8b7cf7;
            --orb-speaking: #4f8ef7;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --bubble-user: #4f8ef7;
            --bubble-user-text: #ffffff;
            --bubble-assistant: #2a2a3a;
            --bubble-assistant-text: #e8edf5;
            --scrollbar-track: #1a1a24;
            --scrollbar-thumb: #3a3a4a;
            --menu-bg: #1a1a24;
            --menu-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --badge-bg: #2a2a3a;
            --badge-text: #9aa9bb;
            --quick-btn-bg: #2a2a3a;
            --quick-btn-hover: #3a3a4a;
            --tab-active: #4f8ef7;
        }

        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
            overflow: hidden;
        }

        /* ===== HEADER ===== */
        #header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px 6px;
            flex-shrink: 0;
            background: var(--surface);
            border-bottom: 1px solid var(--surface-border);
            transition: background 0.3s ease;
        }
        #brand {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        #brand svg {
            width: 24px;
            height: 24px;
        }
        #brand h1 {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, #3b82f6, #7b6cf7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        #header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #theme-toggle {
            background: var(--surface-border);
            border: none;
            border-radius: 50%;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.25s ease;
            color: var(--text-secondary);
            font-size: 14px;
        }
        #theme-toggle:hover {
            background: var(--quick-btn-hover);
            color: var(--text-primary);
        }

        /* ===== ORB ===== */
        #orb-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 8px 0 6px;
            flex-shrink: 0;
        }
        #orb {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, var(--orb-idle), #1a2332);
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.15);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
        }
        #orb:hover { transform: scale(1.04); }
        #orb.listening {
            background: radial-gradient(circle at 30% 30%, var(--orb-listening), #1a2332);
            box-shadow: 0 0 70px rgba(79, 142, 247, 0.25);
            animation: orbPulse 1.2s ease-in-out infinite;
        }
        #orb.thinking {
            background: radial-gradient(circle at 30% 30%, var(--orb-thinking), #1a2332);
            box-shadow: 0 0 70px rgba(123, 108, 247, 0.25);
            animation: orbSpin 2s linear infinite;
        }
        #orb.speaking {
            background: radial-gradient(circle at 30% 30%, var(--orb-speaking), #1a2332);
            box-shadow: 0 0 70px rgba(59, 130, 246, 0.2);
            animation: orbSpeak 0.6s ease-in-out infinite alternate;
        }
        @keyframes orbPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes orbSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes orbSpeak { 0% { transform: scale(1) translateY(0); } 100% { transform: scale(1.04) translateY(-3px); } }

        #orb-status {
            margin-top: 8px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
        }
        #orb-sub {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 1px;
            font-weight: 400;
        }

        /* ===== QUICK ACTIONS ===== */
        #quick-actions {
            display: flex;
            gap: 6px;
            padding: 0 12px 6px;
            flex-shrink: 0;
            overflow-x: auto;
            flex-wrap: nowrap;
            -webkit-overflow-scrolling: touch;
        }
        #quick-actions::-webkit-scrollbar { height: 0; }
        .quick-btn {
            flex-shrink: 0;
            padding: 5px 12px;
            border-radius: 30px;
            border: 1px solid var(--surface-border);
            background: var(--quick-btn-bg);
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .quick-btn:hover {
            background: var(--quick-btn-hover);
            color: var(--text-primary);
            border-color: var(--tab-active);
        }
        .quick-btn i { font-size: 11px; }

        /* ===== CHAT ===== */
        #chat-wrapper {
            flex: 1;
            min-height: 0;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            background: var(--surface);
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--surface-border);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            margin: 0 12px 6px;
            transition: background 0.3s ease;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px 18px;
            scroll-behavior: smooth;
        }
        #chat-container::-webkit-scrollbar { width: 3px; }
        #chat-container::-webkit-scrollbar-track { background: var(--scrollbar-track); }
        #chat-container::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 10px; }

        .message {
            margin: 5px 0;
            padding: 8px 14px;
            border-radius: 14px;
            max-width: 80%;
            word-wrap: break-word;
            animation: fadeIn 0.25s ease;
            line-height: 1.5;
            font-size: 13px;
            font-weight: 400;
        }
        .user-msg {
            background: var(--bubble-user);
            color: var(--bubble-user-text);
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .assistant-msg {
            background: var(--bubble-assistant);
            color: var(--bubble-assistant-text);
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }
        .message .sender {
            font-weight: 600;
            font-size: 10px;
            opacity: 0.6;
            display: block;
            margin-bottom: 1px;
            letter-spacing: 0.3px;
        }
        .assistant-msg .sender { color: var(--text-secondary); }
        .user-msg .sender { color: rgba(255,255,255,0.7); }
        .message .content { display: block; }

        .tool-msg {
            background: var(--surface-border);
            color: var(--text-secondary);
            margin: 3px auto;
            padding: 4px 12px;
            border-radius: 30px;
            font-size: 11px;
            text-align: center;
            max-width: 85%;
            font-weight: 450;
        }

        /* ===== FOOTER ===== */
        #footer {
            display: none;
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn { from { opacity:0; transform:translateY(4px); } to { opacity:1; transform:translateY(0); } }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            #orb { width: 56px; height: 56px; }
            #brand h1 { font-size: 15px; }
            #orb-status { font-size: 12px; }
            .message { font-size: 12px; padding: 6px 12px; max-width: 88%; }
            #chat-container { padding: 10px 12px; }
            #quick-actions { padding: 0 8px 4px; gap: 4px; }
            .quick-btn { font-size: 10px; padding: 4px 10px; }
            #header { padding: 6px 12px 4px; }
            #splash-logo { width: 80px; height: 80px; font-size: 32px; }
            #splash-title { font-size: 24px; }
            #splash-loader { width: 150px; }
        }
    </style>
</head>

        // ============================================================
        // SPEECH RECOGNITION
        // ============================================================
        function initSpeechRecognition() {
            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SR) return null;
            const rec = new SR();
            rec.lang = 'hi-IN';
            rec.continuous = false;
            rec.interimResults = false;
            rec.maxAlternatives = 1;

            rec.onstart = () => {
                clearRestartTimer();
                setOrbState(STATE.LISTENING);
            };

            rec.onresult = (event) => {
                const transcript = event.results[0][0].transcript.trim();
                console.log('🎤 USER SAID:', transcript);
                if (transcript.length > 0) {
                    stopListening();
                    handleUserQuery(transcript);
                }
            };

            rec.onerror = (event) => {
                console.error('Speech error:', event.error);
                if (event.error === 'not-allowed') {
                    orbStatus.textContent = 'Microphone access denied';
                    setOrbState(STATE.IDLE);
                } else if (event.error === 'no-speech') {
                    scheduleRestart(800);
                } else {
                    scheduleRestart(1000);
                }
            };

            rec.onend = () => {
                if (state === STATE.LISTENING && !isProcessing && !isRestartScheduled) {
                    scheduleRestart(300);
                } else if (!isProcessing && state !== STATE.SPEAKING) {
                    setOrbState(STATE.IDLE);
                }
            };

            return rec;
        }

        // ============================================================
        // ORB CONTROLS
        // ============================================================
        function setOrbState(newState) {
            state = newState;
            orb.className = newState;
            const statusMap = {
                idle: ['Zishu is ready', 'Tap orb or press Space'],
                listening: ['Listening...', 'Speak now'],
                thinking: ['Thinking...', 'Processing...'],
                speaking: ['Speaking...', 'Zishu is responding']
            };
            const [status, sub] = statusMap[newState] || statusMap.idle;
            orbStatus.textContent = status;
            orbSub.textContent = sub;
        }

        orb.addEventListener('click', toggleListening);

        function toggleListening() {
            if (isProcessing) return;
            if (state === STATE.IDLE || state === STATE.SPEAKING) startListening();
            else if (state === STATE.LISTENING) stopListening();
        }

        function startListening() {
            clearRestartTimer();
            if (!recognition) {
                recognition = initSpeechRecognition();
                if (!recognition) return;
            }
            try {
                recognition.start();
                setOrbState(STATE.LISTENING);
            } catch (e) {
                try { recognition.stop(); } catch (ex) {}
                setTimeout(() => {
                    try { recognition.start(); } catch (ex) {}
                }, 200);
            }
        }

        function stopListening() {
            clearRestartTimer();
            if (recognition) {
                try { recognition.stop(); } catch (e) {}
            }
            if (!isProcessing) setOrbState(STATE.IDLE);
        }

        function scheduleRestart(delay) {
            clearRestartTimer();
            isRestartScheduled = true;
            restartTimer = setTimeout(() => {
                isRestartScheduled = false;
                if (state === STATE.IDLE || state === STATE.LISTENING) {
                    startListening();
                }
            }, delay);
        }

        function clearRestartTimer() {
            isRestartScheduled = false;
            if (restartTimer) {
                clearTimeout(restartTimer);
                restartTimer = null;
            }
        }

        // ============================================================
        // LOCAL COMMAND DETECTION
        // ============================================================
        function detectLocalCommand(query) {
            const q = query.toLowerCase().trim();

            for (const [site, aliases] of Object.entries(SITE_ALIASES)) {
                const siteFound = aliases.some(alias => q.includes(alias));
                if (!siteFound) continue;

                const wantsOpen = OPEN_WORDS.some(word => q.includes(word)) ||
                                 aliases.some(alias => q === alias) ||
                                 q === site;

                if (wantsOpen) {
                    console.log('✅ WEBSITE COMMAND:', { site, url: WEBSITE_MAP[site] });
                    return { type: 'open_website', value: site };
                }
            }

            // Weather
            if (q.includes('weather') || q.includes('mausam') || q.includes('मौसम')) {
                const cityMatch = q.match(/(?:weather|mausam|मौसम)\s+(?:in|of|for|का|की|में)?\s*([a-zA-Z\u0900-\u097F\s]+)/);
                return { type: 'weather', value: cityMatch ? cityMatch[1].trim() : 'Delhi' };
            }

            // Time
            if (q.includes('time') || q.includes('samay') || q.includes('समय')) {
                return { type: 'time' };
            }

            // Calculate
            if (q.includes('calculate') || q.includes('solve') || q.includes('हल')) {
                const expr = q.replace(/calculate|solve|हल|करो|karo/g, '').trim();
                if (expr) return { type: 'calculate', value: expr };
            }

            return null;
        }

        // OPEN WEBSITE

        function openWebsiteDirectly(siteName) {
            const url = WEBSITE_MAP[siteName];
            if (!url) {
                addToolMessage('Website not found: ' + siteName);
                return false;
            }
            addToolMessage('Opening ' + siteName + '...');
            try {
                window.location.assign(url);
                return true;
            } catch (e) {
                try { window.location.href = url; return true; } catch (e2) {
                    try {
                        const a = document.createElement('a');
                        a.href = url;
                        a.target = '_blank';
                        a.rel = 'noopener noreferrer';
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        return true;
                    } catch (e3) {
                        addToolMessage('Could not open ' + siteName);
                        return false;
                    }
                }
            }
        }

        // ============================================================
        // TOOL FUNCTIONS
        // ============================================================
        async function getWeather(city) {
            try {
                const response = await fetch('https://wttr.in/' + encodeURIComponent(city) + '?format=%C+%t');
                const data = await response.text();
                return data.trim() || 'Weather data unavailable';
            } catch {
                return 'Could not fetch weather.';
            }
        }

        function addToolMessage(text) {
            const div = document.createElement('div');
            div.className = 'tool-msg';
            div.textContent = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // ADD MESSAGE
        // ============================================================
        function addMessage(sender, text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = sender;
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            contentSpan.textContent = text;
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // ============================================================
        // STREAM RESPONSE
        // ============================================================
        async function streamResponse(text) {
            setOrbState(STATE.SPEAKING);

            const msgDiv = document.createElement('div');
            msgDiv.className = 'message assistant-msg';
            const senderSpan = document.createElement('span');
            senderSpan.className = 'sender';
            senderSpan.textContent = 'Zishu';
            const contentSpan = document.createElement('span');
            contentSpan.className = 'content';
            msgDiv.appendChild(senderSpan);
            msgDiv.appendChild(contentSpan);
            chatContainer.appendChild(msgDiv);

            let accumulated = '';
            for (let i = 0; i < text.length; i++) {
                accumulated += text[i];
                contentSpan.textContent = accumulated;
                chatContainer.scrollTop = chatContainer.scrollHeight;
                await new Promise(r => setTimeout(r, 10 + Math.random() * 6));
            }

            speakText(text);
            return msgDiv;
        }

        // ============================================================
        // TTS
        // ============================================================
        function speakText(text) {
            try {
                if (currentUtterance) window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 0.85;
                utterance.pitch = 1.1;
                utterance.volume = 1;

                const voices = window.speechSynthesis.getVoices();
                const femaleVoices = voices.filter(v =>
                    v.lang.startsWith('hi') &&
                    (v.name.toLowerCase().includes('female') ||
                     v.name.toLowerCase().includes('swara') ||
                     v.name.toLowerCase().includes('lekh'))
                );
                if (femaleVoices.length > 0) utterance.voice = femaleVoices[0];
                else {
                    const hindiVoice = voices.find(v => v.lang.startsWith('hi'));
                    if (hindiVoice) utterance.voice = hindiVoice;
                }

                utterance.onstart = () => setOrbState(STATE.SPEAKING);
                utterance.onend = () => {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
                };
                utterance.onerror = () => {
                    currentUtterance = null;
                    if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
                };

                currentUtterance = utterance;
                window.speechSynthesis.speak(utterance);
            } catch (error) {
                console.error('TTS error:', error);
                if (!isProcessing) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
            }
        }

        // ============================================================
        // MAIN QUERY HANDLER
        // ============================================================
        async function handleUserQuery(query) {
            if (isProcessing) return;
            isProcessing = true;
            clearRestartTimer();
            setOrbState(STATE.THINKING);

            addMessage('You', query, 'user-msg');

            const localCmd = detectLocalCommand(query);
            if (localCmd) {
                if (localCmd.type === 'open_website') {
                    openWebsiteDirectly(localCmd.value);
                    isProcessing = false;
                    setOrbState(STATE.IDLE);
                    scheduleRestart(1200);
                    return;
                } else if (localCmd.type === 'weather') {
                    const weather = await getWeather(localCmd.value || 'Delhi');
                    const reply = `Weather in ${localCmd.value || 'Delhi'}: ${weather}`;
                    addMessage('Zishu', reply, 'assistant-msg');
                    speakText(reply);
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                } else if (localCmd.type === 'time') {
                    const now = new Date();
                    const time = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
                    const reply = `Current time is ${time}`;
                    addMessage('Zishu', reply, 'assistant-msg');
                    speakText(reply);
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                } else if (localCmd.type === 'calculate') {
                    try {
                        const result = Function('"use strict"; return (' + localCmd.value + ')')();
                        const reply = `Result: ${result}`;
                        addMessage('Zishu', reply, 'assistant-msg');
                        speakText(reply);
                    } catch (e) {
                        addMessage('Zishu', 'Could not calculate that.', 'assistant-msg');
                    }
                    isProcessing = false;
                    scheduleRestart(1000);
                    return;
                }
            }

            // LLM Query
            conversationHistory.push({ role: 'user', content: query });

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + GROQ_API_KEY
                    },
                    body: JSON.stringify({
                        model: GROQ_MODEL,
                        messages: [
                            { role: 'system', content: SYSTEM_PROMPT },
                            ...conversationHistory
                        ],
                        temperature: 0.7,
                        max_tokens: 500,
                        stream: false
                    })
                });

                if (!response.ok) throw new Error('API Error: ' + response.status);

                const data = await response.json();
                const reply = data.choices[0].message.content;

                conversationHistory.push({ role: 'assistant', content: reply });

                // Save memory
                const memory = JSON.parse(localStorage.getItem('zishu_memory') || '{}');
                const nameMatch = reply.match(/(?:your name is|aapka naam|tumhara naam|mera naam)\s+([a-zA-Z\u0900-\u097F\s]+)/i);
                if (nameMatch && !memory.name) {
                    memory.name = nameMatch[1].trim();
                    localStorage.setItem('zishu_memory', JSON.stringify(memory));
                }

                await streamResponse(reply);

            } catch (error) {
                console.error('Error:', error);
                addToolMessage('Error: ' + error.message);
                setOrbState(STATE.IDLE);
            } finally {
                isProcessing = false;
                if (state !== STATE.LISTENING) { setOrbState(STATE.IDLE); scheduleRestart(1000); }
            }
        }

        // ============================================================
        // KEYBOARD SHORTCUT
        // ============================================================
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && !e.repeat && !e.target.matches('input, textarea')) {
                e.preventDefault();
                toggleListening();
            }
        });

        // ============================================================
        // PRELOAD TTS
        // ============================================================
        if (window.speechSynthesis) {
            window.speechSynthesis.getVoices();
            window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
        }

        // ============================================================
        // INIT
        // ============================================================
        setOrbState(STATE.IDLE);
        addMessage('Zishu', 'Namaste! Main Zishu hoon. Main Hinglish mein baat karti hoon. Kya help chahiye?', 'assistant-msg');

        console.log('🚀 Zishu AI v3.2 - Dark Mode + 100+ Websites');
        console.log('🌐 Total Websites:', Object.keys(WEBSITE_MAP).length);
        console.log('🎯 Press Space or tap orb to start');
    </script>
</body>
